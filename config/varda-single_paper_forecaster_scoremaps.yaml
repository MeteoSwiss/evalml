# yaml-language-server: $schema=../workflow/tools/config.schema.json
description: |
  Evaluation of Varda-Single version 1.0.

dates:
  start: 2025-04-01T00:00
  end: 2026-03-31T18:00
  frequency: 30h

runs:
  - forecaster:
      label: Varda-single
      checkpoint: https://service.meteoswiss.ch/mlstore#/experiments/602/runs/98d4e297f0164f18a0ad50fb01fbff42
      config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-oper.yaml
      steps: 0/120/6
  - baseline:
      label: ICON-CH1-CTRL
      root: /store_new/mch/msopr/osm/ICON-CH1-EPS
      steps: 0/33/6
      member: control

truth:
  label: KENDA-CH1
  root: /store_new/mch/msopr/ml/datasets/mch-ich1-1km-2024-2026-1h-pl13-v2.0.zarr

experiment:
  params:
    - T_2M
    - TD_2M
    - SP_10M
    - TOT_PREC6
    - PMSL
  stratification:
    regions:
      - icon
      - jura
      - mittelland
      - alpennordhang
      - innerealpentaeler
      - alpensuedseite
      - alpen
      - tiefelagen
      - berge
    root: /scratch/mch/bhendj/regions/Prognoseregionen_LV95_20220517
  thresholds:
    TOT_PREC6:
      gt: [0.0, 0.1, 5, 10, 20, 50]
    SP_10M:
      gt: [2.5, 5.0, 10.0]
    T_2M:
      lt: [273.15]
      gt: [288.15, 298.15]
  dashboard:
    stratification:
      # - region
      # - init_hour
      - season
  scorecards:
    enabled: false
    sections:
      short_range:
        baseline: ICON-CH1-CTRL
        lead_times: "6/33/6"
        stratification: region
        variables:
          - "U_10M:RMSE,R2,ETS"
          - "T_2M:RMSE,R2"
          - "TOT_PREC6:RMSE,R2,ETS"
  scoremaps:
    enabled: true
    leadtimes: [6, 24]
    params: ["T_2M", "SP_10M", "TOT_PREC6", "PMSL"]
    scores: ["BIAS", "RMSE"]


locations:
  output_root: output/

profile:
  executor: slurm
  global_resources:
    gpus: 16
  default_resources:
    slurm_partition: "postproc"
    cpus_per_task: 1
    mem_mb_per_cpu: 1800
    runtime: "1h"
    gpus: 0
    slurm_account: s83
  jobs: 20
