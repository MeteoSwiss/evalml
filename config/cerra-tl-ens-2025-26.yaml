# yaml-language-server: $schema=../workflow/tools/config.schema.json
description: |
  CERRA-v3 -> KENDA-CH1 transfer learning, ensemble (10 members, as ICON-CH1-EPS), 2025-26
  evaluation: both encoders at step 5000 (0.7 cut-off, run 97db726c; KNN-12, run 3a7be252).
  Inits: 18 per month on the 42 h grid from the 1st 00 UTC of Oct 2025, Jan, Apr and Jul 2026
  (72), steps 0/120/6; none in any model's training or validation period. Inputs: the eval LAM
  built by det-sgm-cerra's Snakefile (`eval_datasets`, bit-identical to the training LAM on
  Sep-Dec 2025) and the od/0001 global zarr of training to 2026-05-05T18, then the v4 zarr
  (od/0001 from 2026-05-12), via cerra-tl-kendach1-2026-patch.yaml. Truth: the KENDA-CH1 v2.0
  extension to Oct 2026. Regions, thresholds and ICON baselines as the SON 2025 configs.

config_label: cerra-tl-ens-2025-26

