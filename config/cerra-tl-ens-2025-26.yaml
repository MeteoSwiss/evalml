runs:
  - forecaster:
      label: CERRA-TL-ENS-step5000
      checkpoint: /scratch/mch/mbosch/devml/varda-forecaster-ens-sgm-cerra/data/checkpoint/kept/97db726c-inference-step_005000.ckpt
      config: resources/inference/configs/sgm-multidataset-forecaster-cerra-tl-2026.yaml
      steps: 0/120/6
      ensemble:
        members: 10
        seed: 0
      output_variables: [2t, 2d, 10u, 10v, msl, tp]
      inference_resources:
        slurm_partition: normal
        gpu: 4
      extra_requirements:
        - anemoi-inference==0.11.1

  - forecaster:
      label: CERRA-TL-ENS-KNN12-step5000
      checkpoint: /scratch/mch/mbosch/devml/varda-forecaster-ens-sgm-cerra/data/checkpoint/kept/3a7be252-inference-step_005000.ckpt
      config: resources/inference/configs/sgm-multidataset-forecaster-cerra-tl-2026.yaml
      steps: 0/120/6
      ensemble:
        members: 10
        seed: 0
      output_variables: [2t, 2d, 10u, 10v, msl, tp]
      inference_resources:
        slurm_partition: normal
        gpu: 4
      extra_requirements:
        - anemoi-inference==0.11.1

  # ICON control members: baselines are read one member at a time on this branch, so they
  # are deterministic participants (their CRPS is their MAE). ICON-CH1-EPS runs to +33 h.
  - baseline:
      label: ICON-CH1-ctrl
      root: /store_new/mch/msopr/osm/ICON-CH1-EPS
      steps: 0/33/6

  - baseline:
      label: ICON-CH2-ctrl
      root: /store_new/mch/msopr/osm/ICON-CH2-EPS
      steps: 0/120/6

truth:
  label: KENDA-CH1
  root: /store_new/mch/msopr/ml/datasets/mch-ich1-1km-2024-102026-1h-pl13-v2.0.zarr

experiment:
  params:
    - T_2M
    - TD_2M
    - SP_10M
    - PMSL
    - TOT_PREC6
  stratification:
    regions:
      - icon
      - mittelland
      - berge
      - alpensuedseite
    root: /store_new/mch/msopr/ml/regions/Prognoseregionen_LV95_20220517
  thresholds:
    TOT_PREC6:
      gt: [0.1, 5, 20, 50]
    SP_10M:
      gt: [5.0, 10.0, 15.0, 20]
    T_2M:
      lt: [263.15, 268.15, 273.15]
      gt: [298.15, 303.15, 308.15]
  dashboard:
    stratification:
      - season
      - region
  scorecards:
    enabled: false
  scoremaps:
    enabled: false

locations:
  output_root: output/

