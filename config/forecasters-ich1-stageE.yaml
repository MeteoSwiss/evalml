# yaml-language-server: $schema=../workflow/tools/config.schema.json
description: |
  Evaluate skill of ICON-CH1 single, stage E.

dates:
  start: 2024-01-01T06:00
  end: 2025-01-01T00:00
  frequency: 66h
  blacklist:
    - 2024-01-25T06:00 # missing ICON-CH2-EPS archive cycle (FCST24/24012506_790)
    - 2024-04-24T06:00 # missing date in mch-ich1-1km-2024-2025-1h-pl13-v1.0.zarr input dataset

runs:
  - forecaster:
      checkpoint: /scratch/mch/apennino/output/checkpoint/c30490b6ba064e4db03b430f3a2595ad/inference-last.ckpt
      label: stage_E_icon_1km
      steps: 0/120/6
      config: resources/inference/configs/sgm-forecaster-global-ich1-stageE.yaml
      extra_requirements:
        - earthkit-utils<0.2.0
        - earthkit-data<0.19.0
        - anemoi-inference==0.11.1

  - forecaster:
      checkpoint: /scratch/mch/huppd/varda/checkpoints/stage_E_icon_1km_cutoff_edges_subgrid_horography/inference-last.ckpt
      label: stage_E_icon_1km_cloud_cover
      steps: 0/120/6
      config: resources/inference/configs/sgm-forecaster-global-ich1-stageE.yaml
      extra_requirements:
        - earthkit-utils<0.2.0
        - earthkit-data<0.19.0
        - anemoi-inference==0.11.1

  - baseline:
      label: ICON-CH2-EPS
      root: /store_new/mch/msopr/osm/ICON-CH2-EPS
      steps: 0/120/6

  - baseline:
      label: ICON-CH1-EPS
      root: /store_new/mch/msopr/osm/ICON-CH1-EPS
      steps: 0/30/6 # ICON-CH1-EPS archive only extends to ~33h lead time

truth:
  label: KENDA-CH1
  root: /store_new/mch/msopr/ml/datasets/mch-ich1-1km-2024-2025-1h-pl13-v1.0.zarr

experiment:
  params:
    - T_2M
    - TD_2M
    - U_10M
    - V_10M
    - TOT_PREC
    - SKT
    - CLCT
    - CLCH
    - CLCM
    - CLCL
  stratification:
    regions:
      - jura
      - mittelland
      - voralpen
      - alpennordhang
      - innerealpentaeler
      - alpensuedseite
    root: /store_new/mch/msopr/ml/regions/Prognoseregionen_LV95_20220517
  thresholds:
    TOT_PREC:
      gt: [0.0, 1, 5]
    U_10M:
      gt: [2.5, 5.0, 10.0]
    V_10M:
      gt: [2.5, 5.0, 10.0]
    T_2M:
      lt: [273.15]
      gt: [288.15, 298.15]
  dashboard:
    stratification:
      # - init_hour
      # - region
      - season
  scoremaps:
    enabled: false
  scorecards:
    enabled: true
    sections:
      overview:
        baseline: ICON-CH2-EPS
        lead_times: "0/120/6"
        stratification: region
        variables:
          - T_2M
          - TD_2M
          - U_10M
          - V_10M
          - TOT_PREC
          - CLCT
          - CLCH
          - CLCM
          - CLCL

locations:
  output_root: output/

profile:
  executor: slurm
  global_resources:
    gpus: 16
  default_resources:
    slurm_partition: "postproc"
    cpus_per_task: 1
    mem_mb_per_cpu: 1800
    runtime: "1h"
    gpus: 0
  jobs: 50
