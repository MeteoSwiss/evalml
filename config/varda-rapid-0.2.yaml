# yaml-language-server: $schema=../workflow/tools/config.schema.json
description: |
  Evaluate skill of Varda-rapid against ground observations.

config_label: varda-single-1.0-nudge

dates:
  start: 2025-01-01T06:00
  end: 2025-12-31T06:00
  frequency: 294h
  # - 2025-03-01T00:00
  # - 2025-04-02T06:00
  # - 2025-07-02T12:00
  # - 2025-11-02T18:00

runs:
  - temporal_downscaler:
      checkpoint: https://service.meteoswiss.ch/mlstore#/models/sruc-m-2-interpolator/versions/3
      label: Varda-rapid-0.1
      steps: 0/12/1
      config: resources/inference/configs/sgm-temporal-downscaler-global_trimedge_multi_with_nudging.yaml
      extra_requirements:
        - anemoi-datasets==0.5.35
        - git+https://github.com/MeteoSwiss/anemoi-plugins-meteoswiss@6e6b2dd42e66d9c981bd8f5ccca657f0411e4ccc
        - git+https://github.com/ecmwf/anemoi-inference@eaeb36fae30c754a03b8dc0442fc56373b6bedef
      forecaster:
        checkpoint: https://service.meteoswiss.ch/mlstore#/models/sruc-m-1-forecaster/versions/4
        config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-oper.yaml
        steps: 0/12/6
        extra_requirements:
          - git+https://github.com/ecmwf/anemoi-inference@eaeb36fae30c754a03b8dc0442fc56373b6bedef

  - temporal_downscaler:
      checkpoint: https://service.meteoswiss.ch/mlstore#/models/sruc-m-2-interpolator/versions/3
      label: Varda-single-1.0
      steps: 0/12/1
      config: resources/inference/configs/sgm-temporal-downscaler-global_trimedge_multi.yaml
      extra_requirements:
        - anemoi-datasets==0.5.35
        - git+https://github.com/ecmwf/anemoi-inference@eaeb36fae30c754a03b8dc0442fc56373b6bedef
      forecaster:
        checkpoint: https://service.meteoswiss.ch/mlstore#/models/sruc-m-1-forecaster/versions/4
        config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-oper.yaml
        steps: 0/12/6
        extra_requirements:
          - git+https://github.com/ecmwf/anemoi-inference@eaeb36fae30c754a03b8dc0442fc56373b6bedef

  - baseline:
      label: INCA
      root: /store_new/mch/msclim/INCA
      steps: 0/6/1

truth:
  label: SwissMetNet
  # Retrieve over the broad ICON domain (matching notebooks/d_eff_generator.ipynb's
  # STATIONS_SEL), then trim to stations within the real Swiss national border
  # (filter_mode=switzerland) or within a predefined bounding box (filter_mode=domain;domain_bbox=45.7,48.0,5.8,10.8).
  root: jretrievedwh:bbox=40.5,53.0,0.0,17.5;use_limitation=40;filter_mode=switzerland
  # root: jretrievedwh:bbox=40.5,53.0,0.0,17.5;use_limitation=40;filter_mode=domain;domain_bbox=45.7,48.0,5.8,10.8


experiment:
  params:
    - T_2M
    - TD_2M
    - U_10M
    - V_10M
    - TOT_PREC
    - PMSL
    - PS
  stratification:
    regions:
      - mittelland
      - berge
      - alpennordseite
      - alpensuedseite
      - jura
    root: /store_new/mch/msopr/ml/regions/Prognoseregionen_LV95_20220517
  thresholds:
    TOT_PREC:
      gt: [0.0, 1, 5]
    U_10M:
      gt: [2.5, 5.0, 10.0]
    V_10M:
      gt: [2.5, 5.0, 10.0]
    T_2M:
      lt: [273.15]
      gt: [288.15, 298.15]
  dashboard:
    stratification:
      - season
  cross_validation:
    # Stations withheld from nudging in the nudge-partial inference run.
    exclude_stations:
      - CHM
      - FRE
      - RUE
      - BAS
      - PLF
      - CGI
      - HOE
      - PUY
      - RAG
      - EIN
      - ALT
      - GOS
      - COV
      - ULR
      - BIN
      - GUE
      - ROE
      - BIA
      - CEV
      - OTL
    enabled: true
    sections:
      nowcasting:
        baseline: INCA
        lead_times: "0/6/1"
        stratification: region
        variables:
          - "U_10M:RMSE,R2,ETS"
          - "V_10M:RMSE,R2,ETS"
          - "T_2M:RMSE,R2,ETS"
          - "TOT_PREC:RMSE,R2,ETS"
          - "TD_2M:RMSE,R2,ETS"
  scoremaps:
    enabled: false

showcase:
  params:
    - T_2M
    - TD_2M
    - U_10M
    - V_10M
  meteograms:
    enabled: false
    stations: [JUN, KLO, LUG, GVE] #, COV, GOR, WFJ, SAE, SAM, DAV, ZER, ANT, VSBAS, BRT, LTB, GOS, CEV, BIA]
  animations:
    fps: 0.5
    enabled: true
    domains:
      # - globe
      # - europe
      - alps
      - icon-ch
      - switzerland

locations:
  output_root: output/

profile:
  executor: slurm
  global_resources:
    gpus: 16
  default_resources:
    slurm_partition: "postproc"
    cpus_per_task: 1
    mem_mb_per_cpu: 1800
    runtime: "1h"
    gpus: 0
  jobs: 50
