# yaml-language-server: $schema=../workflow/tools/config.schema.json
description: |
  Evaluate skill of Varda-rapid against ground observations.

config_label: varda-rapid-0.2

dates:
  start: 2025-01-01T06:00
  end: 2025-12-31T06:00
  frequency: 294h
  # - 2025-03-01T00:00
  # - 2025-04-02T06:00
  # - 2025-07-02T12:00
  # - 2025-11-02T18:00

runs:
  - temporal_downscaler:
      checkpoint: https://service.meteoswiss.ch/mlstore#/models/sruc-m-2-interpolator/versions/3
      label: Varda-rapid-0.1
      steps: 0/12/1
      config: resources/inference/configs/sgm-temporal-downscaler-global_trimedge_multi_with_nudging.yaml
      extra_requirements:
        - anemoi-datasets==0.5.35
        - git+https://github.com/MeteoSwiss/anemoi-plugins-meteoswiss@f62ae9f3eae7bb2d19837d220b10a7bddf35a57c
        - git+https://github.com/ecmwf/anemoi-inference@88c1ec13632c570f246cc2580ce324e45f36a03b
      forecaster:
        checkpoint: https://service.meteoswiss.ch/mlstore#/models/sruc-m-1-forecaster/versions/4
        config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-oper.yaml
        steps: 0/12/6
        extra_requirements:
          - git+https://github.com/MeteoSwiss/anemoi-plugins-meteoswiss@f62ae9f3eae7bb2d19837d220b10a7bddf35a57c
          - git+https://github.com/ecmwf/anemoi-inference@88c1ec13632c570f246cc2580ce324e45f36a03b

  - temporal_downscaler:
      checkpoint: https://service.meteoswiss.ch/mlstore#/models/sruc-m-2-interpolator/versions/3
      label: Varda-single-1.0
      steps: 0/12/1
      config: resources/inference/configs/sgm-temporal-downscaler-global_trimedge_multi.yaml
      extra_requirements:
        - anemoi-datasets==0.5.35
        - git+https://github.com/MeteoSwiss/anemoi-plugins-meteoswiss@f62ae9f3eae7bb2d19837d220b10a7bddf35a57c
        - git+https://github.com/ecmwf/anemoi-inference@88c1ec13632c570f246cc2580ce324e45f36a03b
      forecaster:
        checkpoint: https://service.meteoswiss.ch/mlstore#/models/sruc-m-1-forecaster/versions/4
        config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-oper.yaml
        steps: 0/12/6
        extra_requirements:
          - git+https://github.com/MeteoSwiss/anemoi-plugins-meteoswiss@f62ae9f3eae7bb2d19837d220b10a7bddf35a57c
          - git+https://github.com/ecmwf/anemoi-inference@88c1ec13632c570f246cc2580ce324e45f36a03b

  - baseline:
      label: INCA
      root: /store_new/mch/msclim/INCA
      steps: 0/6/1

truth:
  label: SwissMetNet
  root: jretrievedwh:bbox=45.7,48.0,5.8,10.8;use_limitation=40

experiment:
  params:
    - T_2M
    - TD_2M
    - U_10M
    - V_10M
    - TOT_PREC
    - PMSL
    - PS
  stratification:
    regions:
      - switzerland
      - mittelland
      - berge
      - alpennordseite
      - alpensuedseite
      - jura
    root: /store_new/mch/msopr/ml/regions/Prognoseregionen_LV95_20220517
  thresholds:
    TOT_PREC:
      gt: [0.0, 1, 5]
    U_10M:
      gt: [2.5, 5.0, 10.0]
    V_10M:
      gt: [2.5, 5.0, 10.0]
    T_2M:
      lt: [273.15]
      gt: [288.15, 298.15]
  dashboard:
    stratification:
      - season
      - region
  # Stations withheld from nudging in the nudge-partial inference run.
  station_holdout:
    - CHM
    - FRE
    - RUE
    - BAS
    - PLF
    - CGI
    - HOE
    - PUY
    - RAG
    - EIN
    - ALT
    - GOS
    - COV
    - ULR
    - BIN
    - GUE
    - ROE
    - BIA
    - CEV
    - OTL
  scoremaps:
    enabled: false

showcase:
  params:
    - T_2M
    - TD_2M
    - U_10M
    - V_10M
  meteograms:
    enabled: false
    stations: [JUN, KLO, LUG, GVE] #, COV, GOR, WFJ, SAE, SAM, DAV, ZER, ANT, VSBAS, BRT, LTB, GOS, CEV, BIA]
  animations:
    enabled: true
    frames_per_second: 0.5
    domains:
      # - globe
      # - europe
      - alps
      - icon-ch
      - switzerland

locations:
  output_root: output/

profile:
  executor: slurm
  global_resources:
    gpus: 16
  default_resources:
    slurm_partition: "normal"
    cpus_per_task: 1
    mem_mb_per_cpu: 1800
    runtime: "1h"
    gpus: 0
    slurm_account: s83
  jobs: 50
