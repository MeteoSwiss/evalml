# yaml-language-server: $schema=../workflow/tools/config.schema.json
description: |
  Single-case inference for the paper meteogram: Varda-Single at init
  2025-06-27 18:00 only. Produces the candidate forecast GRIB under output/;
  baselines (ICON-CH1/CH2-EPS) are read live from the archive at plot time and
  the observations from jretrieve, so only the candidate needs inference here.

dates:
  start: 2025-06-27T18:00
  end: 2025-06-27T18:00
  frequency: 30h

runs:
  - temporal_downscaler:
      checkpoint: /scratch/mch/miccatta/ICON_interpolator_checkpoints/checkpoint_stage-C-interpolator-n320-6hto1h-reduced-variables/f9279244ed6f4c458597bdcf335ab36f/inference-last.ckpt
      label: Varda-single
      steps: 0/120/1
      config: resources/inference/configs/sgm-temporal-downscaler-global_trimedge_multi.yaml
      extra_requirements:
        - anemoi-datasets==0.5.35
        - anemoi-inference==0.11.1
        - git+https://github.com/MeteoSwiss/anemoi-plugins-meteoswiss.git@b4835d76346e1e5ec0181884520da00e317fbfbc
      forecaster:
        checkpoint: https://service.meteoswiss.ch/mlstore#/experiments/602/runs/98d4e297f0164f18a0ad50fb01fbff42
        config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-oper.yaml
        steps: 0/120/6
        # Pin anemoi-inference for the forecaster env too: without this the
        # checkpoint-derived requirements leave it unpinned -> latest is installed,
        # which fails writing the initial-state GRIB (KeyError 'FI_100'). 0.11.1 fixes it.
        extra_requirements:
          - anemoi-inference==0.11.1
  - baseline:
      label: ICON-CH1-CTRL
      root: /store_new/mch/msopr/osm/ICON-CH1-EPS
      steps: 0/33/1
      member: control
  - baseline:
      label: ICON-CH2-CTRL
      root: /store_new/mch/msopr/osm/ICON-CH2-EPS
      steps: 0/120/1
      member: control
  - baseline:
      label: ICON-CH1-EPS mean
      root: /store_new/mch/msopr/osm/ICON-CH1-EPS
      steps: 0/33/1
      member: mean
  - baseline:
      label: ICON-CH2-EPS mean
      root: /store_new/mch/msopr/osm/ICON-CH2-EPS
      steps: 0/120/1
      member: mean

truth:
  label: SwissMetNet
  root: jretrieve:1,2

# Inert for `inference_all` (only the candidate GRIB is produced here); present
# because the config schema requires it.
experiment:
  params:
    - T_2M
    - SP_10M
    - TOT_PREC1
  stratification:
    regions:
      - icon
    root: /scratch/mch/bhendj/regions/Prognoseregionen_LV95_20220517
  thresholds:
    SP_10M:
      gt: [2.5, 5.0, 10.0]
    T_2M:
      lt: [273.15]
  dashboard:
    stratification:
      - season

locations:
  output_root: output/

profile:
  executor: slurm
  global_resources:
    gpus: 16
  default_resources:
    slurm_partition: "postproc"
    cpus_per_task: 1
    mem_mb_per_cpu: 1800
    runtime: "1h"
    gpus: 0
    slurm_account: s83
  jobs: 20
