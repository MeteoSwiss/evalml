# yaml-language-server: $schema=../workflow/tools/config.schema.json
description: |
  Evaluate skill of Varda-single's stage C against ground observations or REA-L, and against a multistep model

config_label: multistep-vs-varda-stage-c

dates:
  start: 2024-01-01T00:00
  end: 2024-12-31T00:00
  frequency: 54h # ideally a multiple of 6h, because Varda's forecaster is trained on 6h strides.



runs:
  - temporal_downscaler:
      checkpoint: https://service.meteoswiss.ch/mlstore#/models/sruc-m-2-interpolator/versions/3 # This is Varda's downscaler. It's trained on REA-L-CH1 but we also use it on analyses (stage E)
      label: Varda-single-stage-C
      steps: 0/120/1
      config: resources/inference/configs/sgm-temporal-downscaler-global_trimedge_multi.yaml
      extra_requirements:
        - anemoi-datasets==0.5.35
        # NOTE pinned: later versions raise KeyError in earthkit_state.wrap_state
        # because the state carries GRIB names (U_10M) while the checkpoint's
        # typed_variables are keyed by anemoi names (10u)
        - anemoi-inference==0.11.1
        # NOTE this pins the merge commit that introduced 'copy-prognostic-from-forecaster',
        # which the inference config above uses at the forecaster's overlap steps
        - git+https://github.com/MeteoSwiss/anemoi-plugins-meteoswiss.git@b4835d76346e1e5ec0181884520da00e317fbfbc
      forecaster:
        checkpoint: /scratch/mch/apennino/output/checkpoint/a69e95db4b494679ab20440f8540a835/inference-last.ckpt # This is Varda's Stage C (trained on analyses, no rollout training)
        config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1.yaml
        steps: 0/120/6

  # This is the MULTISTEP model. It's trained without rollout on REA-L-CH1 (stage C, to is it comparable with Varda's stage C).
  - forecaster:
      checkpoint: /scratch/mch/miccatta/anemoi-outputs/checkpoint_stage_C_multistep_in7_out6_BALFRIN/0eb1b8759c3c4ad188bc1e7cf8d0f1ab/inference-last.ckpt
      label: Multistep-stage-C
      steps: 0/120/1
      config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-1h.yaml


  # - baseline:
  #     label: INCA
  #     root: /store_new/mch/msclim/INCA
  #     steps: 0/6/1
  - baseline:
      label: ICON-CH2-CTRL
      root: /store_new/mch/msopr/osm/ICON-CH2-EPS
      steps: 0/120/1
  - baseline:
      label: ICON-CH1-CTRL
      root: /store_new/mch/msopr/osm/ICON-CH1-EPS
      steps: 0/33/1

truth:
  # label: SwissMetNet
  # root: jretrievedwh:1,2
  # To verify against SwissMetNet observations from the DWH via jretrievedwh,
  # set instead (requires jretrievedwh.py on $PATH and $OPR_HOME set):
  # Other selectors: root: jretrievedwh:locations=ARO,KLO,LUG
  #                  root: jretrievedwh:bbox=45.8,47.8,5.9,10.5
  #                  append ;stage=devt to target a non-prod DWH stage
  label: REA-L
  root: /store_new/mch/msopr/ml/datasets/mch-realch1-fdb-1km-2005-2025-1h-pl13-v1.0.zarr

experiment:
  params:
    - T_2M
    - TD_2M
    - U_10M
    - V_10M
    - TOT_PREC1
  stratification:
    regions:
      - icon
      # - berge
      # - mittelland
      # - mittelland
      # - alpennordseite
      # - alpensuedseite
      # - jura
    root: /store_new/mch/msopr/ml/regions/Prognoseregionen_LV95_20220517
  thresholds:
    TOT_PREC1:
      gt: [0.0, 0.1, 1, 5, 10]
    U_10M:
      gt: [2.5, 5.0, 10.0]
    V_10M:
      gt: [2.5, 5.0, 10.0]
    T_2M:
      lt: [273.15]
      gt: [288.15, 298.15]
  dashboard:
    stratification:
      # - region
      # - init_hour
      - season
  scorecards:
    enabled: false
    sections:
      nowcasting:
        baseline: INCA
        lead_times: "0/6/1"
        stratification: region
        variables:
          - "U_10M:RMSE,R2,ETS"
          - "V_10M:RMSE,R2,ETS"
          - "T_2M:RMSE,R2,ETS"
          - "TOT_PREC:RMSE,R2,ETS"
      short_range:
        baseline: ICON-CH1-CTRL
        lead_times: "6/33/6"
        stratification: region
        variables:
          - "U_10M:RMSE,R2,ETS"
          - "V_10M:RMSE,R2,ETS"
          - "T_2M:RMSE,R2,ETS"
          - "TOT_PREC:RMSE,R2,ETS"
      medium_range:
        baseline: ICON-CH2-CTRL
        lead_times: "24/120/24"
        stratification: region
        variables:
          - "U_10M:RMSE,R2,ETS"
          - "V_10M:RMSE,R2,ETS"
          - "T_2M:RMSE,R2,ETS"
          - "TOT_PREC:RMSE,R2,ETS"
  scoremaps:
    enabled: false

showcase:
  params:
    - T_2M
    - SP_10M
    - TOT_PREC # TOT_PREC1 is not supported for showcases yet
  meteograms:
    enabled: false
    stations: [JUN] #, COV, GOR, WFJ, SAE, SAM, DAV, ZER, ANT, VSBAS, BRT, LTB, GOS, CEV, BIA]
  animations:
    enabled: true
    domains:
      - globe
      - europe
      # - alps
      - icon-ch
      # - switzerland

locations:
  output_root: output/

profile:
  executor: slurm
  global_resources:
    gpus: 16
  default_resources:
    slurm_partition: "postproc"
    cpus_per_task: 1
    mem_mb_per_cpu: 1800
    runtime: "1h"
    gpus: 0
    slurm_account: s83
  jobs: 50
