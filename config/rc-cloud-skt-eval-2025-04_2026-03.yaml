# yaml-language-server: $schema=../workflow/tools/config.schema.json
description: |
  Evaluation of the Varda-single release candidate (clouds + skin temperature), MRB-984:
  RC forecaster (stage 4, run 07f64210) alone and with the RC temporal downscaler (run d642c4ba),
  next to the operational Varda-single 1.0 chain. One year, inits every 42 h (cycling 00/18/12/06 UTC).
  Needs the cloud-skt-support branch and the KENDA-CH1 v2.0 metadata patches.

dates:
  start: 2025-04-01T00:00
  end: 2026-03-31T00:00
  frequency: 42h

runs:
  - forecaster:
      checkpoint: /scratch/mch/huppd/checkpoint/07f642102d8a4da99680f187422170b6/inference-last.ckpt
      label: Release-Candidate-Forecaster-only
      steps: 0/120/6
      config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-oper.yaml
      extra_requirements:
        - earthkit-utils<0.2.0
        - earthkit-data<0.19.0
        - anemoi-inference==0.11.1

  # RC chain: RC temporal downscaler on top of the RC forecaster
  - temporal_downscaler:
      checkpoint: /scratch/mch/huppd/checkpoint/d642c4ba99e54ad9a38fcbcaeab21cf8/inference-last.ckpt
      label: Release-Candidate
      steps: 0/120/1
      config: resources/inference/configs/sgm-temporal-downscaler-global_trimedge_multi.yaml
      extra_requirements:
        - anemoi-datasets==0.5.35
        - git+https://github.com/ecmwf/anemoi-inference.git@88c1ec13632c570f246cc2580ce324e45f36a03b
        - git+https://github.com/MeteoSwiss/anemoi-plugins-meteoswiss.git@e5f95f3eb7b8907407faa7ac2e2771c1d7fe5aa4
      forecaster:
        checkpoint: /scratch/mch/huppd/checkpoint/07f642102d8a4da99680f187422170b6/inference-last.ckpt
        config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-oper.yaml
        steps: 0/120/6
        extra_requirements:
          - earthkit-utils<0.2.0
          - earthkit-data<0.19.0
          - anemoi-inference==0.11.1

  # Operational Varda-single 1.0 chain. Copied from config/varda-single-1.0.yaml
  - temporal_downscaler:
      checkpoint: https://service.meteoswiss.ch/mlstore#/models/sruc-m-2-interpolator/versions/3
      label: Varda-single-1.0
      steps: 0/120/1
      config: resources/inference/configs/sgm-temporal-downscaler-global_trimedge_multi.yaml
      extra_requirements:
        - anemoi-datasets==0.5.35
        - git+https://github.com/ecmwf/anemoi-inference.git@88c1ec13632c570f246cc2580ce324e45f36a03b
        - git+https://github.com/MeteoSwiss/anemoi-plugins-meteoswiss.git@e5f95f3eb7b8907407faa7ac2e2771c1d7fe5aa4
      forecaster:
        checkpoint: https://service.meteoswiss.ch/mlstore#/models/varda-forecaster-det-sgm/versions/1
        config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-oper.yaml
        steps: 0/120/6
        extra_requirements:
          - anemoi-datasets==0.5.35
          - git+https://github.com/ecmwf/anemoi-inference.git@88c1ec13632c570f246cc2580ce324e45f36a03b
          - git+https://github.com/MeteoSwiss/anemoi-plugins-meteoswiss.git@e5f95f3eb7b8907407faa7ac2e2771c1d7fe5aa4

  - baseline:
      label: INCA
      root: /store_new/mch/msclim/INCA # archive ends 2025-12-31: no INCA for the 2026 inits
      steps: 0/6/1

  - baseline:
      label: ICON-CH1-CTRL
      root: /store_new/mch/msopr/osm/ICON-CH1-EPS
      steps: 0/33/1

  - baseline:
      label: ICON-CH2-CTRL
      root: /store_new/mch/msopr/osm/ICON-CH2-EPS
      steps: 0/120/1

truth:
  label: KENDA-CH1
  root: /store_new/mch/msopr/ml/datasets/mch-ich1-1km-2024-2026-1h-pl13-v2.0.zarr

experiment:
  params:
    - T_2M
    - TD_2M
    - U_10M
    - V_10M
    - SP_10M
    - TOT_PREC1
    - PMSL
    - T_G
    - CLCT
    - CLCL
    - CLCM
    - CLCH
  stratification:
    regions:
      - icon 
    root: /store_new/mch/msopr/ml/regions/Prognoseregionen_LV95_20220517
  thresholds: # as in varda-single-1.0.yaml, plus clear / overcast for cloud cover frequency bias
    TOT_PREC1:
      gt: [0.0, 0.1, 1, 5, 10]
    SP_10M:
      gt: [2.5, 5.0, 10.0]
    T_2M:
      lt: [273.15]
      gt: [288.15, 298.15]
    CLCT:
      lt: [20]
      gt: [80]
  dashboard:
    stratification:
      - season
      - init_hour
  scorecards: # as in varda-single-1.0.yaml, with TOT_PREC1 instead of TOT_PREC6
    enabled: true
    sections:
      nowcasting:
        baseline: INCA
        lead_times: "0/6/1"
        stratification: region
        variables:
          - "U_10M:RMSE,R2,ETS"
          - "V_10M:RMSE,R2,ETS"
          - "T_2M:RMSE,R2,ETS"
          - "TOT_PREC1:RMSE,R2,ETS"
      short_range:
        baseline: ICON-CH1-CTRL
        lead_times: "6/33/6"
        stratification: region
        variables:
          - "U_10M:RMSE,R2,ETS"
          - "V_10M:RMSE,R2,ETS"
          - "T_2M:RMSE,R2,ETS"
          - "TOT_PREC1:RMSE,R2,ETS"
      medium_range:
        baseline: ICON-CH2-CTRL
        lead_times: "24/120/24"
        stratification: region
        variables:
          - "U_10M:RMSE,R2,ETS"
          - "V_10M:RMSE,R2,ETS"
          - "T_2M:RMSE,R2,ETS"
          - "TOT_PREC1:RMSE,R2,ETS"
  scoremaps:
    enabled: false

locations:
  output_root: output/

profile:
  executor: slurm
  global_resources:
    gpus: 16
  default_resources:
    slurm_partition: "postproc"
    slurm_extra: "'--exclude=nid[002249-002251,002253-002254]'"
    cpus_per_task: 1
    mem_mb_per_cpu: 1800
    runtime: "1h"
    gpus: 0
    slurm_account: s83
  jobs: 20
