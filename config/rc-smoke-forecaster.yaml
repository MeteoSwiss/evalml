# yaml-language-server: $schema=../workflow/tools/config.schema.json
description: |
  Smoke test of the Varda-single release candidate forecaster (stage E with rollout,
  run 675fcbb6). Deliberately restricted to the pre-RC parameters so that no cloud /
  SKT code changes are needed yet - this only checks that the checkpoint loads, runs
  and verifies end to end. See EVALML_CLOUD_SKT_PLAN.md for the real evaluation.

dates:
  - 2025-09-01T00:00

runs:
  - forecaster:
      checkpoint: /scratch/mch/huppd/checkpoint/675fcbb6ec9d46ba9affffb37f7e0862/inference-last.ckpt
      label: rc_stage_E_with_rollout
      steps: 0/12/6
      config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-rc-smoke.yaml
      extra_requirements:
        - earthkit-utils<0.2.0
        - earthkit-data<0.19.0
        - anemoi-inference==0.11.1

  - forecaster:
      checkpoint: /scratch/mch/huppd/varda/checkpoints/stage_E_icon_1km_cutoff_edges_subgrid_horography/inference-last.ckpt
      label: stage_E_no_rollout
      steps: 0/12/6
      config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-rc-smoke.yaml
      extra_requirements:
        - earthkit-utils<0.2.0
        - earthkit-data<0.19.0
        - anemoi-inference==0.11.1

  - forecaster:
      checkpoint: /store_new/mch/msopr/ml/models/amber-ridge/inference-last.ckpt
      label: varda_single_1.0
      steps: 0/12/6
      config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-rc-smoke.yaml
      extra_requirements:
        - earthkit-utils<0.2.0
        - earthkit-data<0.19.0
        - anemoi-inference==0.11.1

  - baseline:
      label: ICON-CH2-EPS
      root: /store_new/mch/msopr/osm/ICON-CH2-EPS
      steps: 0/12/6

truth:
  label: KENDA-CH1
  root: /store_new/mch/msopr/ml/datasets/mch-ich1-1km-2024-2025-1h-pl13-v1.0.zarr

experiment:
  params:
    - T_2M
    - TD_2M
    - U_10M
    - V_10M
    - TOT_PREC
  stratification:
    regions:
      - mittelland
    root: /store_new/mch/msopr/ml/regions/Prognoseregionen_LV95_20220517
  dashboard:
    stratification:
      - season
  scoremaps:
    enabled: false

locations:
  output_root: output/

profile:
  executor: slurm
  global_resources:
    gpus: 16
  default_resources:
    slurm_partition: "postproc"
    slurm_extra: "'--exclude=nid[002249-002251,002253-002254]'"
    cpus_per_task: 1
    mem_mb_per_cpu: 1800
    runtime: "1h"
    gpus: 0
    slurm_account: s83
  jobs: 20
