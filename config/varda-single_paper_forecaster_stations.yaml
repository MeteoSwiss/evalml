# yaml-language-server: $schema=../workflow/tools/config.schema.json
description: |
  Evaluation of Varda-Single version 1.0.

dates:
  start: 2025-04-01T00:00
  end: 2025-12-26T18:00 # to ensure that the full forecasts is in 2025
  frequency: 30h

runs:
  - forecaster:
      label: Varda-Single
      checkpoint: https://service.meteoswiss.ch/mlstore#/experiments/602/runs/c30490b6ba064e4db03b430f3a2595ad
      config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-oper.yaml
      steps: 0/120/6
  - forecaster:
      label: stage-E-with-rollout
      checkpoint: https://service.meteoswiss.ch/mlstore#/experiments/602/runs/98d4e297f0164f18a0ad50fb01fbff42
      config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-oper.yaml
      steps: 0/120/6
  # - forecaster:
  #     checkpoint: https://huggingface.co/ecmwf/aifs-single-1.1/resolve/main/aifs-single-mse-1.1.ckpt
  #     label: AIFS-single-1.1
  #     steps: 0/120/6
  #     config: resources/inference/configs/aifs-single-forecaster.yaml
  #     extra_requirements:
  #       - torch-geometric==2.4.0
  #       - anemoi-inference==0.11.1
  #       - anemoi-models==0.5.0
  #       - https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.6cxx11abiFALSE-cp312-cp312-linux_x86_64.whl
  #     disable_local_eccodes_definitions: true
  - baseline:
      label: ICON-CH1-CTRL
      root: /store_new/mch/msopr/osm/ICON-CH1-EPS
      steps: 0/33/6
      member: control
  - baseline:
      label: ICON-CH2-CTRL
      root: /store_new/mch/msopr/osm/ICON-CH2-EPS
      steps: 0/120/6
      member: control
  - baseline:
      label: ICON-CH1-EPS mean
      root: /store_new/mch/msopr/osm/ICON-CH1-EPS
      steps: 0/33/6
      member: mean
  - baseline:
      label: ICON-CH2-EPS mean
      root: /store_new/mch/msopr/osm/ICON-CH2-EPS
      steps: 0/120/6
      member: mean

truth:
  label: SwissMetNet
  root: jretrieve:1,2

experiment:
  params:
    - T_2M
    - TD_2M
    - SP_10M
    - TOT_PREC6
    - PMSL
  stratification:
    regions:
      - icon
      - jura
      - mittelland
      - alpennordhang
      - innerealpentaeler
      - alpensuedseite
    root: /scratch/mch/bhendj/regions/Prognoseregionen_LV95_20220517
  thresholds:
    TOT_PREC6:
      gt: [0.0, 0.1, 5, 10, 20, 50]
    SP_10M:
      gt: [2.5, 5.0, 10.0]
    T_2M:
      lt: [273.15]
      gt: [288.15, 298.15]
  dashboard:
    stratification:
      # - region
      # - init_hour
      - season
  scorecards:
    enabled: true
    sections:
      short_range:
        baseline: ICON-CH1-CTRL
        lead_times: "6/33/6"
        stratification: region
        variables:
          - "U_10M:RMSE,R2,ETS"
          - "T_2M:RMSE,R2"
          - "TOT_PREC6:RMSE,R2,ETS"
      medium_range:
        baseline: ICON-CH2-CTRL
        lead_times: "24/120/24"
        stratification: region
        variables:
          - "U_10M:RMSE,R2,ETS"
          - "T_2M:RMSE,R2"
          - "TOT_PREC6:RMSE,R2,ETS"

locations:
  output_root: output/

profile:
  executor: slurm
  global_resources:
    gpus: 16
  default_resources:
    slurm_partition: "postproc"
    cpus_per_task: 1
    mem_mb_per_cpu: 1800
    runtime: "1h"
    gpus: 0
    slurm_account: s83
  jobs: 20
