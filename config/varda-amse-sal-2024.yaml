# yaml-language-server: $schema=../workflow/tools/config.schema.json
description: |
  AMSE experiment set, option B: does training with a spectral AMSE term reduce the
  structure error (SAL S > 0) of 6 h precipitation? Held-out 2024 initialisations with
  >= 2 mm KENDA-CH1 domain-mean precipitation over +6..+30 h, JJA vs Jan/Feb/Dec 2024.

  The three experiment models differ ONLY in their loss (same warm start, data, graph,
  rollout schedule), so the comparison that answers the question is control vs AMSE.
  2024 is held out for all three (training stopped at 2023) and is covered by their own
  inputs (REA-L-CH1 + ERA5 n320), unlike the paper's 2025 events. Varda-single and
  ICON-CH1-CTRL are context, not the baseline.

  SAL itself is computed offline: each forecaster also writes lam.nc (tp only, LAM points)
  next to evalml's GRIB -- see resources/inference/configs/*-lam-netcdf.yaml. The truth
  fields for the same windows come from varda-forecaster-det-sgm/scripts/sal_select_inits.py.

config_label: varda-amse-sal-2024

dates:
  # BEGIN generated by sal_select_inits.py -- do not edit by hand
  - 2024-07-01T00:00
  # END generated

runs:
  - forecaster:
      label: Control (MSE)
      checkpoint: /iopsstor/scratch/cscs/mbosch/devml/varda-forecaster-det-sgm/data/output/exp_control_rollout_mse/checkpoint/3908158e768e421692f2aceb70793d9b/inference-last.ckpt
      config: resources/inference/configs/sgm-forecaster-global-lam-netcdf.yaml
      steps: 0/30/6
      inference_resources: &gpu1
        slurm_partition: normal
        gpu: 1
        runtime: 45m
      # The checkpoints record anemoi-core and anemoi-datasets as local checkouts that are
      # not on PyPI (anemoi-models 0.19.0.post24 from the feat/amse-2d-transforms branch,
      # anemoi-datasets 0.5.37.dev2); pin the exact commits they were trained with.
      extra_requirements: &amse_reqs
        - anemoi-models @ git+https://github.com/ecmwf/anemoi-core.git@b356a75a51e1c56e4d9c555ac5e8ae6f392cd9f2#subdirectory=models
        - anemoi-graphs @ git+https://github.com/ecmwf/anemoi-core.git@b356a75a51e1c56e4d9c555ac5e8ae6f392cd9f2#subdirectory=graphs
        - anemoi-datasets @ git+https://github.com/ecmwf/anemoi-datasets.git@7597d85ec759aa8c21f87a30e706e767b7800697
        - anemoi-transform==0.4.1
  - forecaster:
      label: AMSE rollout
      checkpoint: /iopsstor/scratch/cscs/mbosch/devml/varda-forecaster-det-sgm/data/output/exp_rollout_amse/checkpoint/0c9ea9269a0142c892c766c536d21aa4/inference-last.ckpt
      config: resources/inference/configs/sgm-forecaster-global-lam-netcdf.yaml
      steps: 0/30/6
      inference_resources: *gpu1
      extra_requirements: *amse_reqs
  - forecaster:
      label: AMSE sgm + rollout
      checkpoint: /iopsstor/scratch/cscs/mbosch/devml/varda-forecaster-det-sgm/data/output/exp_sgm_amse_rollout/checkpoint/b97e49b9bacd47f1b18901b105a228a9/inference-last.ckpt
      config: resources/inference/configs/sgm-forecaster-global-lam-netcdf.yaml
      steps: 0/30/6
      inference_resources: *gpu1
      extra_requirements: *amse_reqs
  # Context. Varda-single reads its own (ICON-CH1 operational) inputs; 2024 is in range.
  - forecaster:
      label: Varda-single
      checkpoint: https://service.meteoswiss.ch/mlstore#/models/sruc-m-1-forecaster/versions/4
      config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-oper-lam-netcdf.yaml
      steps: 0/30/6
      inference_resources: *gpu1
      extra_requirements:
        - anemoi-datasets==0.5.35
        - git+https://github.com/MeteoSwiss/anemoi-plugins-meteoswiss.git@b4835d76346e1e5ec0181884520da00e317fbfbc
  - baseline:
      label: ICON-CH1-CTRL
      root: /capstor/store/mch/msopr/osm/ICON-CH1-EPS
      steps: 0/30/1

truth:
  label: KENDA-CH1
  # The only real KENDA-CH1 copy on clariden: the 2024-2026 v2.0 datasets are symlinks
  # into balfrin's /scratch/mch and dangle here.
  root: /capstor/store/mch/msopr/ml/datasets/mch-ich1-1km-2024-2025-1h-pl13-v1.0.zarr

experiment:
  params:
    - TOT_PREC6
  stratification:
    regions:
      - icon
      - mittelland
      - alpennordseite
      - alpensuedseite
    root: /capstor/store/mch/msopr/ml/regions/Prognoseregionen_LV95_20220517
  thresholds:
    TOT_PREC6:
      gt: [0.1, 1, 5, 10, 20]
  dashboard:
    stratification:
      - season
  scorecards:
    enabled: false
  scoremaps:
    enabled: false

showcase:
  params:
    - TOT_PREC6
  meteograms:
    enabled: false
  animations:
    enabled: false

locations:
  output_root: output/

profile:
  executor: slurm
  global_resources:
    gpus: 16
  default_resources:
    # clariden has no postproc/short-shared partitions; every non-GPU job lands on a
    # (GPU) node of `normal`, so keep CPU-side work batched and small.
    slurm_partition: normal
    slurm_account: a0170
    cpus_per_task: 1
    mem_mb_per_cpu: 1800
    runtime: "1h"
    gpus: 0
  jobs: 50
