truth:
  # label: SwissMetNet
  # root: jretrievedwh:1,2
  # To verify against SwissMetNet observations from the DWH via jretrievedwh,
  # set instead (requires jretrievedwh.py on $PATH and $OPR_HOME set):
  # Other selectors: root: jretrievedwh:locations=ARO,KLO,LUG
  #                  root: jretrievedwh:bbox=45.8,47.8,5.9,10.5
  #                  append ;stage=devt to target a non-prod DWH stage
  label: REA-L
  root: /store_new/mch/msopr/ml/datasets/mch-realch1-fdb-1km-2005-2025-1h-pl13-v1.0.zarr

experiment:
  params:
    - T_2M
    - TD_2M
    - U_10M
    - V_10M
    - TOT_PREC1
  stratification:
    regions:
      - icon
      # - berge
      # - mittelland
      # - mittelland
      # - alpennordseite
      # - alpensuedseite
      # - jura
    root: /store_new/mch/msopr/ml/regions/Prognoseregionen_LV95_20220517
  thresholds:
    TOT_PREC1:
      gt: [0.0, 0.1, 1, 5, 10]
    U_10M:
      gt: [2.5, 5.0, 10.0]
    V_10M:
      gt: [2.5, 5.0, 10.0]
    T_2M:
      lt: [273.15]
      gt: [288.15, 298.15]
  dashboard:
    stratification:
      # - region
      # - init_hour
      - season
  scorecards:
    enabled: false
    sections:
      nowcasting:
        baseline: INCA
        lead_times: "0/6/1"
        stratification: region
        variables:
          - "U_10M:RMSE,R2,ETS"
          - "V_10M:RMSE,R2,ETS"
          - "T_2M:RMSE,R2,ETS"
          - "TOT_PREC:RMSE,R2,ETS"
      short_range:
        baseline: ICON-CH1-CTRL
        lead_times: "6/33/6"
        stratification: region
        variables:
          - "U_10M:RMSE,R2,ETS"
          - "V_10M:RMSE,R2,ETS"
          - "T_2M:RMSE,R2,ETS"
          - "TOT_PREC:RMSE,R2,ETS"
      medium_range:
        baseline: ICON-CH2-CTRL
        lead_times: "24/120/24"
        stratification: region
        variables:
          - "U_10M:RMSE,R2,ETS"
          - "V_10M:RMSE,R2,ETS"
          - "T_2M:RMSE,R2,ETS"
          - "TOT_PREC:RMSE,R2,ETS"
  scoremaps:
    enabled: false

showcase:
  params:
    - T_2M
    - SP_10M
    - TOT_PREC # plotted as accumulation over the step spacing (1h for this run)
    - CLCT
    - CLCL
    - CLCM
    - CLCH
    - SSRD
    - STRD
    - T_G
  meteograms:
    enabled: false
    stations: [JUN] #, COV, GOR, WFJ, SAE, SAM, DAV, ZER, ANT, VSBAS, BRT, LTB, GOS, CEV, BIA]
  animations:
    enabled: true
    domains:
      - globe
      - europe
      # - alps
      - icon-ch
      # - switzerland

locations:
  output_root: output/

profile:
  executor: slurm
  global_resources:
    gpus: 16
  default_resources:
    slurm_partition: "postproc"
    cpus_per_task: 1
    mem_mb_per_cpu: 1800
    runtime: "1h"
    gpus: 0
    slurm_account: s83
  jobs: 50