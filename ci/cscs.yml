# Shared evalml CI layer.
#
# The runner and the generic setup fragments (strict-mode preamble, CI-context
# logging, workdir/HOME/uv paths, uv install + sync) are the shared MeteoSwiss
# blocks — see https://github.com/MeteoSwiss/varda-cscs-ci-workflows. Which
# cluster the jobs land on is decided there (cluster.yml), not here.
#
# On top of those blocks this file defines `.evalml-job`: the common runner
# config plus the evalml-specific log-summary artifact that both the longtest
# and heavytest jobs reuse. Each suite lives in its own file (longtest.yml /
# heavytest.yml) and only sets its pytest marker and Slurm time limit.
include:
  - remote: 'https://raw.githubusercontent.com/MeteoSwiss/varda-cscs-ci-workflows/main/v1/.ci-ext-mch.yml'

.evalml-job:
  extends: [.baremetal-runner-mch]
  variables:
    # HOME, uv and the venv live in the runner's checkout, next to the code.
    MCH_WORK_DIR: '$CI_PROJECT_DIR'
    # eckit grid-download cache for inference/plotting.
    ECKIT_GEO_CACHE_PATH: '$CI_PROJECT_DIR/.cache/eckit'
  before_script:
    - !reference [.mch-sh-preamble, script]
    - !reference [.mch-log-ci-context, script]
    - !reference [.mch-env-paths, script]
    - !reference [.mch-install-uv, script]
    - !reference [.mch-uv-sync, script]
  after_script:
    # Collect the snakemake / per-rule / SLURM logs into an HTML summary.
    # Runs in a fresh shell (no venv), so use the system python3 and stdlib only.
    - mkdir -p tests/log
    - python3 ci/summarize_logs.py || true
  artifacts:
    paths:
      - tests/log/**/*
    when: always
    expire_in: 1 week
