include:
  - ci/cscs.yml

heavytest:
  extends: [.baremetal-runner-balfrin]
  before_script:
    - !reference [.sh_preamble, script]
    - !reference [.install_uv, script]
    - !reference [.install_evalml, script]
  script:
    - pytest tests/integration -m heavytest
  after_script:
    - mkdir -p tests/log
    - python3 tools/summarize_logs.py || true
  artifacts:
    paths:
      - tests/log/**/*
    when: always
    expire_in: 1 week
  variables:
    # Explicitly request more time from Slurm, so that the long tests can complete.
    SLURM_TIMELIMIT: "10:00:00"
    # /users/svc_mlforecasting_devt does not exist on compute nodes; redirect HOME so
    # that eckit/earthkit-data can create their cache directories under the job workspace.
    HOME: "$CI_PROJECT_DIR/home"
