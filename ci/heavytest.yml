include:
  - ci/cscs.yml

heavytest:
  extends: [.baremetal-runner-balfrin]
  before_script:
    - !reference [.sh_preamble, script]
    - !reference [.install_uv, script]
    - !reference [.install_evalml, script]
  script:
    # SLURM PAM resets HOME from /etc/passwd at job startup, overriding any GitLab
    # CI variable. Re-set it here so eckit/earthkit-data can create their cache dirs.
    - export HOME="$SCRATCH/.ci_home" && mkdir -p "$HOME"
    - pytest tests/integration -m heavytest
  after_script:
    - export HOME="$SCRATCH/.ci_home" && mkdir -p "$HOME"
    - mkdir -p tests/log
    - python3 tools/summarize_logs.py || true
  artifacts:
    paths:
      - tests/log/**/*
    when: always
    expire_in: 1 week
  variables:
    # Explicitly request more time from Slurm, so that the long tests can complete.
    SLURM_TIMELIMIT: "10:00:00"
