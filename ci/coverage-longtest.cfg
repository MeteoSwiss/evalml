# Tier-2 coverage config for longtest (integration) runs.
#
# The longtests drive the full snakemake subprocess chain
#   pytest -> `evalml` CLI -> snakemake -> `python workflow/scripts/*.py`
# (the leaf scripts, and often whole rules, run in separate processes -- and
# under the `slurm` executor, in separate SLURM jobs). In-process coverage
# cannot see them, so we use coverage.py subprocess mode:
#
#   * parallel = true            -> every process writes its own .coverage.<id>
#   * COVERAGE_PROCESS_START set  -> the a1_coverage.pth startup hook (installed
#                                    in the venv by coverage/pytest-cov) calls
#                                    coverage.process_startup() in each child
#   * pytest-cov combines the data files and reports at session end
#
# Kept out of the default config-discovery path (.coveragerc / pyproject) on
# purpose so it does NOT affect the fast Tier-1 (src-only) run. Use it via
# ci/run-longtest-coverage.sh.
[run]
parallel = true
sigterm = true
relative_files = true
# Directory-based source (not source_pkgs) so EVERY .py under these trees is
# reported -- including modules that no process happens to import during a given
# run (e.g. src/plotting/, exercised only by the scoremap / forecast-frame
# scripts). `source_pkgs` silently omits a package that was never imported,
# which inflates the coverage % by dropping untested code from the denominator.
source =
    src
    workflow/scripts
# The longtests do their real work in subprocesses; the main pytest process
# imports none of the measured code, so it legitimately collects nothing there
# before pytest-cov combines the subprocess data. Mute those two false alarms.
# A genuinely empty *combined* run still fails loudly at report time
# ("No data to report").
disable_warnings =
    module-not-imported
    no-data-collected

[report]
show_missing = true
skip_empty = true
