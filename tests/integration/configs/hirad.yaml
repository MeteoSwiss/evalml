# yaml-language-server: $schema=../../../workflow/tools/config.schema.json
description: |
  Integration-test fixture: minimal experiment run exercising the dashboard
  path (plot_meteogram.py). One reference date, short lead times,
  animations disabled. Driven by tests/integration/test_showcase.py.

config_label: varda-single-1.0

dates:
  - 2023-01-15T00:00
  - 2023-01-15T06:00
  - 2023-01-15T12:00
  - 2023-01-15T18:00

runs:
  - baseline:
      label: ICON-CH1-CTRL
      root: /store_new/mch/msopr/osm/ICON-CH1-EPS
      steps: 0/12/1

truth:
  label: SwissMetNet
  root: jretrievedwh:1,2
  # To verify against SwissMetNet observations from the DWH via jretrievedwh,
  # set instead (requires jretrievedwh.py on $PATH and $OPR_HOME set):
  # Other selectors: root: jretrievedwh:locations=ARO,KLO,LUG
  #                  root: jretrievedwh:bbox=45.8,47.8,5.9,10.5
  #                  append ;stage=devt to target a non-prod DWH stage

experiment:
  params:
    - T_2M
    - TOT_PREC1
  stratification:
    regions:
      - mittelland
      - berge
      - alpennordseite
      - alpensuedseite
      - jura
    root: /store_new/mch/msopr/ml/regions/Prognoseregionen_LV95_20220517
  thresholds:
    TOT_PREC1:
      gt: [0.0, 0.1, 1, 5, 10]
    T_2M:
      lt: [273.15]
      gt: [288.15, 298.15]
  dashboard:
    stratification:
      # - region
      # - init_hour
      - season
  scorecards:
    enabled: true
    sections:
      short_range:
        baseline: ICON-CH1-CTRL
        lead_times: "6/12/6"
        stratification: region
        variables:
          - "T_2M:RMSE,R2,ETS"
          - "TOT_PREC1:RMSE,R2,ETS"
  scoremaps:
    enabled: false

showcase:
  params:
    - T_2M
    - TOT_PREC1
  meteograms:
    enabled: false
    stations: [JUN] #, COV, GOR, WFJ, SAE, SAM, DAV, ZER, ANT, VSBAS, BRT, LTB, GOS, CEV, BIA]
  animations:
    enabled: true
    frames_per_second: 5
    domains:
      # - globe
      - europe
      # - alps
      - icon-ch
      - switzerland

locations:
  output_root: output/

profile:
  executor: slurm
  global_resources:
    gpus: 16
  default_resources:
    slurm_partition: "postproc"
    cpus_per_task: 1
    mem_mb_per_cpu: 1800
    runtime: "1h"
    gpus: 0
  jobs: 50
