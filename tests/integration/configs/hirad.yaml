# yaml-language-server: $schema=../../../workflow/tools/config.schema.json
description: |
  HiRAD downscaling experiments.

config_label: hirad-forecast-test-1.0

dates:
  - 2026-07-30T00:00 # Disaggregation errors: I believe tp is sometimes negative in HiRAD. TODO to fix.
  - 2026-07-31T00:00 # Forecast data that works


runs:
  - grib_forecaster:
      root: '/store_new/mch/msopr/ml/evalml/hirad_grib_data'
      label: HiRAD-downscaling-N320
      steps: 0/12/1
  - baseline:
      label: ICON-CH1-CTRL
      root: /store_new/mch/msopr/osm/ICON-CH1-EPS
      steps: 0/12/1

# HiRAD GRIB data has no elevation coordinate yet.
# TODO: set to true when we fix the GRIB generation.
lapse_rate_correction: false

truth:
  label: SwissMetNet
  root: jretrievedwh:1,2
  # To verify against SwissMetNet observations from the DWH via jretrievedwh,
  # set instead (requires jretrievedwh.py on $PATH and $OPR_HOME set):
  # Other selectors: root: jretrievedwh:locations=ARO,KLO,LUG
  #                  root: jretrievedwh:bbox=45.8,47.8,5.9,10.5
  #                  append ;stage=devt to target a non-prod DWH stage

#truth:
#   label: KENDA-CH1
#   root: /store_new/mch/msopr/ml/datasets/mch-ich1-1km-2024-2025-1h-pl13-v1.0.zarr

experiment:
  params:
    - T_2M
    # TODO Use a derivation of SP_10M instead of 10U and 10V
    - SP_10M
    - U_10M
    - V_10M
    - TOT_PREC1
  stratification:
    regions:
      - mittelland
      - berge
      - alpennordseite
      - alpensuedseite
      - jura
    root: /store_new/mch/msopr/ml/regions/Prognoseregionen_LV95_20220517
  thresholds:
    TOT_PREC1:
      gt: [0.0, 0.1, 1, 5, 10]
    T_2M:
      lt: [273.15]
      gt: [288.15, 298.15]
    SP_10M:
      gt: [2.5, 5, 10, 15]
    U_10M:
      gt: [2.5, 5, 10, 15]
    V_10M:
      gt: [2.5, 5, 10, 15]
  dashboard:
    stratification:
      # - region
      # - init_hour
      - season
  scorecards:
    enabled: true
    sections:
      short_range:
        baseline: ICON-CH1-CTRL
        lead_times: "6/12/6"
        stratification: region
        variables:
          - "T_2M:RMSE,R2,ETS"
          #- "SP_10M:RMSE,R2,ETS"
          - "U_10M:RMSE,R2,ETS"
          - "V_10M:RMSE,R2,ETS"
          - "TOT_PREC1:RMSE,R2,ETS"
  scoremaps:
    enabled: false # requires 24h lead times

showcase:
  params:
    - T_2M
    - SP_10M
    - U_10M
    - V_10M
    - TOT_PREC1
  meteograms:
    enabled: false
    stations: [JUN] #, COV, GOR, WFJ, SAE, SAM, DAV, ZER, ANT, VSBAS, BRT, LTB, GOS, CEV, BIA]
  animations:
    enabled: true
    frames_per_second: 5
    domains:
      # - globe
      # - europe
      - alps
      - icon-ch
      - switzerland

locations:
  output_root: output/

profile:
  executor: slurm
  global_resources:
    gpus: 16
  default_resources:
    slurm_partition: "postproc"
    cpus_per_task: 1
    mem_mb_per_cpu: 1800
    runtime: "1h"
    gpus: 0
  jobs: 50
