# yaml-language-server: $schema=../../../workflow/tools/config.schema.json
description: |
  Evaluate skill of ICON-CH1 single.

# Explicit list, not start/end/frequency: 
# covers two seasons and init times, and has two inits in each bucket, 
# to meaningfully test aggregation. 
dates:
  - 2025-04-01T00:00
  - 2025-04-01T06:00
  - 2025-04-02T00:00
  - 2025-04-02T06:00
  - 2025-06-01T00:00
  - 2025-06-01T06:00
  - 2025-06-02T00:00
  - 2025-06-02T06:00

runs:
  - forecaster:
      checkpoint: https://servicedepl.meteoswiss.ch/mlstore#/experiments/409/runs/b30acf68520a4bbd8324c44666561696
      label: stage_C_icon_1km
      steps: 0/12/6
      config: resources/inference/configs/sgm-forecaster-global-ich1.yaml
      extra_requirements:
        - earthkit-utils<0.2.0
        - earthkit-data<0.19.0
        - anemoi-inference==0.11.1

  - forecaster:
      checkpoint: /scratch/mch/apennino/output/checkpoint/973b78b8b39543949abc2b154c5f98d9/inference-last.ckpt
      label: stage_C_icon_1km_hidden_11
      steps: 0/12/6
      config: resources/inference/configs/sgm-forecaster-global-ich1.yaml
      extra_requirements:
        - earthkit-utils<0.2.0
        - earthkit-data<0.19.0
        - anemoi-inference==0.11.1

  # - forecaster:
  #     checkpoint: https://huggingface.co/met-no/bris_cloudy-skies/blob/main/2025-10/cloudy-skies-2025-10.ckpt
  #     label: bris-cloudy-skies
  #     steps: 0/12/6
  #     config: resources/inference/configs/sgm-forecaster-global-ich1.yaml
  #     disable_local_eccodes_definitions: true
  #     extra_requirements:
  #       - earthkit-utils<0.2.0
  #       - earthkit-data<0.19.0
  #       - git+https://github.com/ecmwf/anemoi-inference.git@main

  - baseline:
      label: ICON-CH2-EPS
      root: /store_new/mch/msopr/osm/ICON-CH2-EPS
      steps: 0/12/6

truth:
  label: KENDA-CH1
  root: /store_new/mch/msopr/ml/datasets/mch-ich1-1km-2024-2025-1h-pl13-v1.0.zarr

experiment:
  params:
    - T_2M
    - TD_2M
    - U_10M
    - V_10M
    - SP_10M
    - PS
    - PMSL
    - TOT_PREC6
    - TOT_PREC
  stratification:
    root: /store_new/mch/msopr/ml/regions/Prognoseregionen_LV95_20220517
    regions:
      - alpen
      - alpensuedseite
      - jura
      - mittelland
  thresholds:
    T_2M:
      lt: [273.15]
      gt: [298.15]
    SP_10M:
      gt: [2.5, 5.0]
      lt: [1.0]
    U_10M:
      gt: [0.0]
      lt: [0.0]
    PMSL:
      gt: [101325.0]
      lt: [100000.0]
    TOT_PREC6:
      gt: [5]
      lt: [0.1]
    TOT_PREC:
      gt: [1]
      lt: [0.1]
  dashboard:
    stratification:
      - season
      - region
      - init_hour
  scorecards:
    enabled: true
    sections:
      by_region:
        baseline: ICON-CH2-EPS
        lead_times: "6/12/6"
        stratification: region
        variables:
          - "T_2M:RMSE,STDE,R2,ETS,POD,FAR"
          - "U_10M:RMSE,STDE,R2,ETS,POD,FAR"
          - "SP_10M:RMSE,STDE,R2,ETS,POD,FAR"
          - "PMSL:RMSE,STDE,R2,ETS,POD,FAR"
          - "TOT_PREC6:RMSE,STDE,R2,ETS,POD,FAR"
          - "TOT_PREC:RMSE,STDE,R2,ETS,POD,FAR"
      by_season:
        baseline: ICON-CH2-EPS
        lead_times: "6/12/6"
        stratification: season
        variables:
          - "T_2M:RMSE,STDE,R2,ETS,POD,FAR"
          - "U_10M:RMSE,STDE,R2,ETS,POD,FAR"
          - "SP_10M:RMSE,STDE,R2,ETS,POD,FAR"
          - "PMSL:RMSE,STDE,R2,ETS,POD,FAR"
          - "TOT_PREC6:RMSE,STDE,R2,ETS,POD,FAR"
          - "TOT_PREC:RMSE,STDE,R2,ETS,POD,FAR"
      by_init_hour:
        baseline: ICON-CH2-EPS
        lead_times: "6/12/6"
        stratification: init_hour
        variables:
          - "T_2M:RMSE,STDE,R2,ETS,POD,FAR"
          - "U_10M:RMSE,STDE,R2,ETS,POD,FAR"
          - "SP_10M:RMSE,STDE,R2,ETS,POD,FAR"
          - "PMSL:RMSE,STDE,R2,ETS,POD,FAR"
          - "TOT_PREC6:RMSE,STDE,R2,ETS,POD,FAR"
          - "TOT_PREC:RMSE,STDE,R2,ETS,POD,FAR"
  scoremaps:
    enabled: true
    params:
      - T_2M
      - U_10M
      - SP_10M
      - PMSL
      - TOT_PREC6
    leadtimes:
      [6, 12]
    scores:
      - BIAS
      - RMSE
      - STDE
    regions:
      - icon-ch
      - switzerland
    seasons:
      - all
      - MAM
      - JJA
    init_hours:
      - all
      - "00"
      - "06"

locations:
  output_root: output/

profile:
  executor: slurm
  global_resources:
    gpus: 16
  default_resources:
    slurm_partition: "postproc"
    cpus_per_task: 1
    mem_mb_per_cpu: 1800
    runtime: "1h"
    gpus: 0
  jobs: 50
