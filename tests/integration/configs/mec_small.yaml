# yaml-language-server: $schema=../../../workflow/tools/config.schema.json
description: |
  Integration-test fixture: minimal --mec run exercising the MEC feedback-file
  path (prepare_mec_input -> link_mec_input -> generate_mec_namelist -> run_mec).
  One short reference window so only a small number of fdbk_files get built.
  Driven by tests/integration/test_mec.py.
config_label: mec-test

# TODO: narrow this further if even 2 days is too slow/expensive for the chosen
# marker (see test_mec.py). REFTIMES_MEC additionally requires reftimes to be
# at least max(steps) after the first date, so keep at least 2 entries with
# enough spacing relative to `steps` below, or MEC will have nothing to verify.
dates:
  start: 2025-08-01T00:00
  end: 2025-08-02T00:00
  frequency: 24h

runs:
  - forecaster:
      # Reusing a known-good checkpoint from config/forecasters-ich1_mec_ffv2.yaml.
      checkpoint: https://service.meteoswiss.ch/mlstore#/experiments/602/runs/9f4626a7562a4eb49700aaaaa8607230
      label: icon_1km_hierarchical_2_level_proc_from_scratch
      # TODO: shorten steps to the minimum lead time MEC needs for one valid
      # time (check _reftimes_mec()/link_mec_input in workflow/rules/verif_obs.smk
      # for how max(steps) constrains which reftimes are eligible).
      steps: 0/12/6
      config: resources/inference/configs/sgm-multidataset-forecaster-global-ich1-oper.yaml
      extra_requirements:
        - anemoi-inference==0.11.1

# Required by the config schema; not exercised by the mec_all target itself.
truth:
  label: KENDA-CH1
  root: /store_new/mch/msopr/ml/datasets/mch-ich1-1km-2024-2025-1h-pl13-v1.0.zarr

experiment:
  params:
    - T_2M
  stratification:
    regions: []
  dashboard:
    stratification:
      - season

locations:
  output_root: output/

# Required for --mec: prepare_mec_input reads observations from these three roots.
# Values copied as-is from config/forecasters-ich1_mec_ffv2.yaml (known-good paths).
mec:
  ekf_root: /store_new/mch/msopr/osm/KENDA-CH1/EKF
  mon_synop_root: /scratch/mch/paa/mec/MEC_ML_input/monFiles2025
  ver_synop_root: /scratch/mch/paa/mec/MEC25_I-CH1

profile:
  executor: slurm
  global_resources:
    gpus: 16
  default_resources:
    slurm_partition: "postproc"
    cpus_per_task: 1
    mem_mb_per_cpu: 1800
    runtime: "1h"
    gpus: 0
    slurm_account: s83
  jobs: 50