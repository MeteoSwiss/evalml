# warm-mesa (Varda-single 1.1) for the 2025-26 evaluation (inits in Oct 2025, Jan, Apr and
# Jul 2026). As sgm-multidataset-ich1-oper-patch.yaml, with inputs that reach Jul 2026:
# - LAM: the KENDA-CH1 v2.0 extension to Oct 2026 (ICON names) instead of the ifsnames v1.0
#   zarr (to 2025-12-31), renamed to the checkpoint's names. On 2025-10-01T00 every model
#   variable equals the v1.0 zarr's after this rename (clouds in % in both, rescaled here).
# - Global: the od/0001 zarr of the oper patch up to its last date (2026-05-05T18), then the
#   v4 zarr (od/0001 again from 2026-05-12), back to back, as for the CERRA-TL models
#   (cerra-tl-kendach1-2026-patch.yaml). Each part selects the checkpoint's 85 variables:
#   concat checks variables before the outer select.
config:
  dataloader:
    test:
      datasets:
        data:
          dataset_config:
            dataset:
              cutout:
                - dataset: /store_new/mch/msopr/ml/datasets/mch-ich1-1km-2024-102026-1h-pl13-v2.0.zarr
                  # The window keeps the 6 h subsampling on 00/06/12/18 UTC: this zarr has no rows for
                  # 2024-04-24 06-12 UTC, so every 6th row from 2024 would land on the wrong hours.
                  start: "2025-09-29T00:00:00"
                  end: "2026-08-06T18:00:00"
                  frequency: 6h
                  # ICON names in this zarr: select (before rename) the ICON name of each model variable.
                  select:
                    - U_10M
                    - V_10M
                    - TD_2M
                    - T_2M
                    - cos_julian_day
                    - cos_latitude
                    - cos_local_time
