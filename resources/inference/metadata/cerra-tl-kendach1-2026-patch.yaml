    test:
      datasets:
        data:
          dataset_config:
            dataset:
              cutout:
              - dataset: /scratch/mch/mbosch/devml/varda-forecaster-det-sgm-cerra/data/datasets/kendach1-1km-202509-202608-6h-cerrav3-eval.zarr
