# Metadata patch for the CERRA-v3 -> KENDA-CH1 transfer-learning checkpoints, for the
# 2025-26 evaluation (inits in Oct 2025, Jan, Apr and Jul 2026). As cerra-tl-kendach1-patch.yaml,
# with other inputs:
# - LAM: kendach1-1km-202509-202608-6h-cerrav3-eval.zarr, built by the det-sgm-cerra Snakefile
#   (`eval_datasets`) from the KENDA-CH1 v2.0 extension to Oct 2026, as the training LAM was.
# - Global: the od/0001 zarr the models were trained on, up to its last date (2026-05-05T18),
#   then the v4 zarr (od/0001 again from 2026-05-12; 0080 on 05-06..05-11, before any July
#   input). Concatenated back to back: no gap, no overlap. The two zarrs carry different
#   variable sets, so each part selects the model's 72 before they are joined.
#
# The previous patch's notes on cutout selects and variables_metadata apply unchanged.
