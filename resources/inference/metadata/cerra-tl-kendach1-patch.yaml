# Metadata patch for the CERRA-v3 -> KENDA-CH1 transfer-learning checkpoints
# (varda-forecaster-det-sgm-cerra, 1_tl_kendach1).
#
# - Input: the checkpoint's own test datasets, with the LAM zarr's workspace-relative path
#   made absolute and the test period lifted (start/end null). The cutout list is replaced
#   wholesale by the patch, so each entry keeps its `select` list from the checkpoint.
# - variables_metadata: the checkpoint names variables by GRIB shortName only; the ICON-CH1
#   GRIB templates are keyed by MARS param (T_2M, ...). The mars blocks are copied from
#   sgm-multidataset-ich1-oper-patch.yaml for the surface fields the verification reads.
config:
  dataloader:
    test:
      datasets:
        data:
          dataset_config:
            dataset:
              cutout:
              - dataset: /scratch/mch/mbosch/varda-forecaster-det-sgm-cerra/datasets/kendach1-1km-2024-2025-6h-cerrav3.zarr
                select:
                - 100u
                - 100v
                - 10u
                - 10v
                - 2d
                - 2t
                - cos_julian_day
                - cos_latitude
                - cos_local_time
                - cos_longitude
                - hcc
                - insolation
                - lcc
                - lsm
                - mcc
                - msl
                - q_100
                - q_1000
                - q_200
                - q_300
                - q_400
                - q_500
                - q_700
                - q_850
                - q_925
                - sin_julian_day
                - sin_latitude
                - sin_local_time
                - sin_longitude
                - skt
                - sp
                - ssrd
                - strd
                - t_100
                - t_1000
                - t_200
                - t_300
                - t_400
                - t_500
                - t_700
                - t_850
                - t_925
                - tcc
                - tp
                - u_100
                - u_1000
