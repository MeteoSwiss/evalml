# Metadata patch for the multistep stage-C forecaster trained on the cutout of
# REA-L (mch-realch1 ... ifsnames-v2.0, 1h) and ERA5 (aifs-ea ... with-era51).
#
# It does two things:
# 1. Rewrites the training dataset paths to their location on balfrin.
# 2. Fixes the pressure-level levelist values from Pa to hPa.
#
# IMPORTANT: no params are renamed here, and levtype stays "unknown" for the
# pressure-level variables. The runner renames state fields to
# {param}_{levelist} after every transform-filter post-processor (the tp
# rescale in the inference config), so the mars metadata must map each
# variable name back to itself: params must stay the native (IFS-style)
# checkpoint names, and levelist must be in hPa so that e.g. q_850 -> q_850
# (with the raw checkpoint metadata it would become q_85000). Renaming to MCH
# shortNames for the ICON GRIB output happens in the output's `patches`
# modifier in the inference config instead, and the level type is taken from
# the matched GRIB template.

config:
  dataloader:
    test:
      datasets:
        data:
          dataset_config:
            dataset:
              cutout:
                - dataset: /store_new/mch/msopr/ml/datasets/mch-realch1-fdb-1km-2005-2025-1h-pl13-ifsnames-v2.0.zarr
                - dataset: /store_new/mch/msopr/ml/datasets/aifs-ea-an-oper-0001-mars-n320-1979-2024-1h-v2-with-era51.zarr
          start: null
          end: null

dataset:
  data:
    variables_metadata:
      # --- pressure-level variables: levelist Pa -> hPa ---
      q_100:
        mars: {levelist: 100}
      q_200:
        mars: {levelist: 200}
      q_300:
        mars: {levelist: 300}
