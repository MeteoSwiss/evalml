# CERRA-v3 -> KENDA-CH1 transfer-learning checkpoints (varda-forecaster-det-sgm-cerra).
# As sgm-multidataset-forecaster-global-ich1-oper.yaml, except:
# - inputs are the checkpoint's own datasets (see the metadata patch), not the operational ones;
# - only the LAM GRIB is written, and only the surface fields with a MARS param in the patch:
#   the model's other outputs (100u/100v, ssrd/strd, cloud covers, skt, ...) have no ICON-CH1
#   template here. No IFS GRIB: nothing global is verified.
# tp is a 6 h accumulation in m, as in the operational inputs, hence the same two
# post-processors.
lead_time: 120h
write_initial_state: true
allow_nans: true

env:
  ANEMOI_INFERENCE_NUM_CHUNKS: 8 # OOM error if not set

input:
  test:
    use_original_paths: true

post_processors:
  - accumulate_from_start_of_forecast: # accumulate tp from start of forecast
      accumulations:
        - tp
  - forward_transform_filter:
      rescale:
        scale: 1000 # convert units from m to kg m-2
        offset: 0
        param: tp

output:
  grib:
    path: grib/{date}{time:04}_{step:03}.grib
    variables: [2t, 2d, 10u, 10v, msl, tp]
    encoding:
      typeOfGeneratingProcess: 2
      centre: lssw
    templates:
      samples: resources/templates_index_icon.yaml
    post_processors:
      - extract_mask: # removes global points
          mask: "lam_0/cutout_mask"
          as_slice: true

patch_metadata: resources/cerra-tl-kendach1-patch.yaml
