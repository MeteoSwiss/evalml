runner: temporal_downscaler

input:
  cutout:
    - lam_0:
        grib:
          path: forecaster/20*
          pre_processors:
            - forward_transform_filter:
                # does not have an effect if the temporal downscaler does not use tp as prognostic variable
                rescale:
                  scale: 0.001 # convert from kg m-2 to m
                  offset: 0
                  param: tp
            # --- Nudging (disabled by default) ---
            # Uncomment to nudge the initial condition toward station observations.
            # 1. retrieve_observation: fetches live data from DWH via jretrieve → raw Parquet
            # 2. clean_observation:    reads raw Parquet, applies QC cleaning → cleaned Parquet
            # 3. nudge_toward_observation: reads cleaned Parquet, applies IoR correction
            # nudge_variables: list of GRIB shortNames to nudge; omit to nudge all (T_2M, U_10M, V_10M, TOT_PREC).
            - forward_transform_filter:
                retrieve_observation:
                  obs_path: observation/nudging_station_obs_raw.parquet
                  jretrieve_src_path: /scratch/mch/llanzila/sruc/evalml/src/data_input/
                  # bbox: [45.7, 48.0, 5.8, 10.8]
                  group: "1,2"
                  variables: [T_2M, TD_2M, U_10M, V_10M, TOT_PREC]
                  use_limitation: 40
                  run_mode: "devt"
                  # Extra trim on top of group/bbox above, matching
                  # notebooks/d_eff_generator.ipynb's station selection exactly —
                  # keeps the retrieved stations a subset of whatever
                  # nudge_toward_observation's d_eff_file cache below was built
                  # from (a station outside that cache raises an error there).
                  station_filter_mode: domain
                  domain_bbox: [45.7, 48.0, 5.8, 10.8]
            - forward_transform_filter:
                clean_observation:
                  obs_path_in: observation/nudging_station_obs_raw.parquet
                  obs_path_out: observation/nudging_station_obs.parquet
            - forward_transform_filter:
                nudge_toward_observation:
                  obs_path: observation/nudging_station_obs.parquet
                  nudge_variables: [T_2M, TD_2M, U_10M, V_10M]
                  icon_grid_dir: /scratch/mch/llanzila/sruc/aux_files
                  topo_file: /scratch/mch/llanzila/sruc/aux_files/topo_descriptors_icon_R19B08.nc
                  dem_barrier_file: /store_new/mch/msclim/appclim/data/grids/topodem/v2/topo/radar_100/topo_DEM_1000M.nc
                  weight_power: 2.0
                  max_dist: 50.0 #44.528      # km, station influence radius (was 0.4 projected degrees; 0.4 * 111.32 km/deg)
                  n_barrier_samples: 50 #40 
                  n_barrier_width_samples: 3
                  barrier_width_m: 1500
                  elev_scale: 50 #26.949      # m/km, ridge height adding 1 km of effective distance (was 3000 m/deg; 3000 / 111.32 km/deg)
                  elev_diff_scale: 100 #35.932     # m/km, endpoint elevation difference adding 1 km (was 4000 m/deg; 4000 / 111.32 km/deg)
                  min_topo_w: 0.2
                  lim_effective: 0.0
                  # Station reliability (v4): shrinks a station's own influence radius
                  # (rather than uniformly down-weighting its contribution) when its
                  # residual disagrees with what its neighbours predict for it via a
                  # leave-one-out spatial-consistency check. number_of_std is the Tukey
                  # biweight rejection threshold in robust (median/MAD) sigmas; a station
                  # at or beyond this many sigmas of disagreement gets reliability=0 and
                  # its radius shrinks to reliability_min_dist_frac * max_dist (never all
                  # the way to zero). Set use_reliability_check: false to fall back to the
                  # pre-v4 behaviour (a single global max_dist shared by every station).
                  use_reliability_check: true
                  number_of_std: 5.0
                  reliability_min_dist_frac: 0.1
                  # Saves a 3-panel PNG (station residual, station reliability, gridded
                  # correction) per nudged variable per reference time. No effect unless
                  # use_reliability_check is true; never affects the nudging correction
                  # itself (plotting failures are logged and skipped).
                  plot_dir: output/nudging_reliability_diagnostics
                  run_mode: "devt"
                  # Stations to withhold from nudging (held-out for cross-validation).
                  exclude_stations: 
                    - COY
                    - FRE
                    - RUE
                    - BAS
                    - PLF
                    - CGI
                    - HOE
                    - PUY
                    - RAG
                    - SAE
                    - ALT
                    - GOS
                    - COV
                    - ULR
                    - BIN
                    - GUE
                    - ROE
                    - BIA
                    - CEV
                    - OTL
          namer: &namer
            rules:
              - - shortName: T
                - t_{level}
              - - shortName: U
                - u_{level}
              - - shortName: V
                - v_{level}
              - - shortName: W
                - w_{level}
              - - shortName: QV
                - q_{level}
              - - shortName: FI
                - z_{level}
              - - shortName: PMSL
                - msl
              - - shortName: FIS
                - z
              - - shortName: PS
                - sp
              - - shortName: T_2M
                - 2t
              - - shortName: TD_2M
                - 2d
              - - shortName: T_G
                - skt
              - - shortName: U_10M
                - 10u
              - - shortName: V_10M
                - 10v
              - - shortName: FR_LAND
                - lsm
              - - shortName: TOT_PREC
                - tp
    - global:
        grib:
          path: forecaster/ifs*
          namer: *namer

constant_forcings:
  test:
    use_original_paths: true

patch_metadata: resources/sgm-temporal-downscaler-ich1-oper-patch.yaml

post_processors:
  - accumulate_from_start_of_forecast: # accumulate tp from start of forecast
      accumulations:
        - tp
  - forward_transform_filter:
      rescale:
        scale: 1000 # convert units from m to kg m-2
        offset: 0
        param: tp

output:
  tee:
    - grib:
        path: grib/{dateTime}_{step:03}.grib
        encoding:
          typeOfGeneratingProcess: 2
        templates:
            samples: resources/templates_index_icon.yaml
        post_processors:
          - extract_mask: # removes global points
              mask: "lam_0/cutout_mask"
              as_slice: true
          # here, the trimedge mask can be specified when available

    - grib:
        path: grib/ifs-{dateTime}_{step:03}.grib
        encoding:
          typeOfGeneratingProcess: 2
        templates:
          samples: resources/templates_index_ifs.yaml
        post_processors:
          - extract_mask: # removes lam points
              mask: "lam_0/cutout_mask"
              as_slice: true
              inverse: true
          - assign_mask: # fill local/global overlapping points with nan
              mask: "global/cutout_mask"
        modifiers:
          - patches:
            - variable:
                U_10M: {"param": 165, "shortName": "10u"}
                10u: {"param": 165, "shortName": "10u"}
                V_10M: {"param": 166, "shortName": "10v"}
                10v: {"param": 166, "shortName": "10v"}
                TD_2M: {"param": 168, "shortName": "2d"}
                2d: {"param": 168, "shortName": "2d"}
                T_2M: {"param": 167, "shortName": "2t"}
                2t: {"param": 167, "shortName": "2t"}
                FR_LAND: {"param": 172, "shortName": "lsm"}
                lsm: {"param": 172, "shortName": "lsm"}
                PMSL: {"param": 151, "shortName": "msl"}
                msl: {"param": 151, "shortName": "msl"}
                PS: {"param": 134, "shortName": "sp"}
                sp: {"param": 134, "shortName": "sp"}
                SSO_SIGMA: {"param": 163, "shortName": "slor"}
                slor: {"param": 163, "shortName": "slor"}
                SSO_STDH: {"param": 160, "shortName": "sdor"}
                sdor: {"param": 160, "shortName": "sdor"}
                TOT_PREC: {"param": 228, "shortName": "tp"}
                tp: {"param": 228, "shortName": "tp"}
                z: {"param": 129, "shortName": "z"}
                "^q_(\\d+)$": {"param": 133, "shortName": "q"}
                "^t_(\\d+)$": {"param": 130, "shortName": "t"}
                "^u_(\\d+)$": {"param": 131, "shortName": "u"}
                "^v_(\\d+)$": {"param": 132, "shortName": "v"}
                "^w_(\\d+)$": {"param": 135, "shortName": "w"}
                "^z_(\\d+)$": {"param": 129, "shortName": "z"}

# silenced due to bug in anemoi-inference for multi-step temporal downscalers, can be removed when fixed
verbosity: 0
allow_nans: true
output_frequency: "1h"
