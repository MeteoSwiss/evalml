runner: temporal_downscaler

input:
  cutout:
    - lam_0:
        grib:
          path: forecaster/20*
          pre_processors:
            - forward_transform_filter:
                # does not have an effect if the temporal downscaler does not use tp as prognostic variable
                rescale:
                  scale: 0.001 # convert from kg m-2 to m
                  offset: 0
                  param: tp
          namer: &namer
            rules:
              - - shortName: T
                - t_{level}
              - - shortName: U
                - u_{level}
              - - shortName: V
                - v_{level}
              - - shortName: W
                - w_{level}
              - - shortName: QV
                - q_{level}
              - - shortName: FI
                - z_{level}
              - - shortName: PMSL
                - msl
              - - shortName: FIS
                - z
              - - shortName: PS
                - sp
              - - shortName: T_2M
                - 2t
              - - shortName: TD_2M
                - 2d
              - - shortName: T_G
                - skt
              - - shortName: U_10M
                - 10u
              - - shortName: V_10M
                - 10v
              - - shortName: FR_LAND
                - lsm
              - - shortName: TOT_PREC
                - tp
    - global:
        grib:
          path: forecaster/ifs*
          namer: *namer

constant_forcings:
  test:
    use_original_paths: true

patch_metadata: resources/sgm-temporal-downscaler-ich1-oper-patch.yaml

# The checkpoint never predicts the surface-diagnostics outputs, so
# anemoi-inference has no metadata of its own for them.
typed_variables:
  SP_10M:
    mars: {param: SP_10M, levtype: sfc}
  DD_10M:
    mars: {param: DD_10M, levtype: sfc}
  RELHUM_2M:
    mars: {param: RELHUM_2M, levtype: sfc}
  TW_2M:
    mars: {param: TW_2M, levtype: sfc}
  HZEROCL:
    mars: {param: HZEROCL, levtype: sfc}
  SNOWLMT:
    mars: {param: SNOWLMT, levtype: sfc}
  CAPE_ML:
    mars: {param: CAPE_ML, levtype: sfc}
  CIN_ML:
    mars: {param: CIN_ML, levtype: sfc}
  CAPE_MU:
    mars: {param: CAPE_MU, levtype: sfc}
  CIN_MU:
    mars: {param: CIN_MU, levtype: sfc}
  PREC_TYPE:
    mars: {param: PREC_TYPE, levtype: sfc}
  # Accumulated from the start of the forecast (startStep forced to 0 below);
  # encoding it as instant would turn the GRIB message into a snowfall rate.
  TOT_SNOW:
    mars: {param: TOT_SNOW, levtype: sfc}
    process: accumulation

post_processors:
  - accumulate_from_start_of_forecast: # accumulate tp from start of forecast
      accumulations:
        - tp
  - forward_transform_filter:
      rescale:
        scale: 1000 # convert units from m to kg m-2
        offset: 0
        param: tp

output:
  tee:
    - grib:
        path: grib/{dateTime}_{step:03}.grib
        encoding:
          typeOfGeneratingProcess: 2
        templates:
            samples: resources/templates_index_icon.yaml
        post_processors:
          - extract_mask: # removes global points
              mask: "lam_0/cutout_mask"
              as_slice: true
          - forward_transform_filter:
              copy-prognostic-from-forecaster:
                forecaster_path: forecaster/20*
                common_leadtime: 6h
                params_to_keep: [tp] # NOTE, if more diagnostics are added, update accordingly.
                namer: *namer
          # The vertical diagnostics match the orography to the state by cell
          # index, so this must run on the full native ICON-CH1 grid (no
          # regridding or trimming before it).
          # MELTLAYER_TOP is computed internally for PREC_TYPE/TOT_SNOW but not
          # written: it has no GRIB code.
          - forward_transform_filter:
              surface-diagnostics:
                u_component: U_10M
                v_component: V_10M
                temperature: T_2M
                dewpoint: TD_2M
                surface_pressure: PS
                temperature_levels: T
                specific_humidity_levels: QV
                geopotential_levels: FI
                precipitation: TOT_PREC
                orography_file: /scratch/mch/icontest/testing-input-data/c2sm/icon-1/external_parameter_icon_grid_0001_R19B08_mch.nc
                variables: [SP_10M, DD_10M, RELHUM_2M, TW_2M, HZEROCL, SNOWLMT,
                            CAPE_ML, CIN_ML, CAPE_MU, CIN_MU, PREC_TYPE, TOT_SNOW]
        modifiers:
          - patches:
            - variable:
                # PREC_TYPE has no COSMO shortName; PTYPE is the GRIB2 precipitation
                # type (0/1/19), values follow INCA (0 none, 1 rain, 2 mixed,
                # 3 snow, 4 freezing rain), not WMO code table 4.201.
                PREC_TYPE: {"shortName": "PTYPE"}
                TOT_SNOW: {"startStep": 0}

    - grib:
        path: grib/ifs-{dateTime}_{step:03}.grib
        encoding:
          typeOfGeneratingProcess: 2
        templates:
          samples: resources/templates_index_ifs.yaml
        post_processors:
          - extract_mask: # removes lam points
              mask: "lam_0/cutout_mask"
              as_slice: true
              inverse: true
          - assign_mask: # fill local/global overlapping points with nan
              mask: "global/cutout_mask"
          - forward_transform_filter:
              copy-prognostic-from-forecaster:
                forecaster_path: forecaster/ifs*
                common_leadtime: 6h
                params_to_keep: [tp] # NOTE, if more diagnostics are added, update accordingly.
                namer: *namer
          - forward_transform_filter:
              surface-diagnostics:
                u_component: U_10M
                v_component: V_10M
                temperature: T_2M
                dewpoint: TD_2M
                surface_pressure: PS
                # No vertical diagnostics here: the orography file is on the
                # ICON-CH1 grid only.
                variables: [SP_10M, DD_10M, RELHUM_2M, TW_2M]
        modifiers:
          - patches:
            - variable:
                U_10M: {"param": 165, "shortName": "10u"}
                10u: {"param": 165, "shortName": "10u"}
                V_10M: {"param": 166, "shortName": "10v"}
                10v: {"param": 166, "shortName": "10v"}
                TD_2M: {"param": 168, "shortName": "2d"}
                2d: {"param": 168, "shortName": "2d"}
                T_2M: {"param": 167, "shortName": "2t"}
                2t: {"param": 167, "shortName": "2t"}
                FR_LAND: {"param": 172, "shortName": "lsm"}
                lsm: {"param": 172, "shortName": "lsm"}
                PMSL: {"param": 151, "shortName": "msl"}
                msl: {"param": 151, "shortName": "msl"}
                PS: {"param": 134, "shortName": "sp"}
                sp: {"param": 134, "shortName": "sp"}
                SSO_SIGMA: {"param": 163, "shortName": "slor"}
                slor: {"param": 163, "shortName": "slor"}
                SSO_STDH: {"param": 160, "shortName": "sdor"}
                sdor: {"param": 160, "shortName": "sdor"}
                TOT_PREC: {"param": 228, "shortName": "tp"}
                tp: {"param": 228, "shortName": "tp"}
                z: {"param": 129, "shortName": "z"}
                SP_10M: {"param": 207, "shortName": "10si"}
                DD_10M: {"param": 260260, "shortName": "10wdir"}
                RELHUM_2M: {"param": 260242, "shortName": "2r"}
                TW_2M: {"param": 261023, "shortName": "wbt", "typeOfLevel": "heightAboveGround", "level": 2}
                "^q_(\\d+)$": {"param": 133, "shortName": "q"}
                "^t_(\\d+)$": {"param": 130, "shortName": "t"}
                "^u_(\\d+)$": {"param": 131, "shortName": "u"}
                "^v_(\\d+)$": {"param": 132, "shortName": "v"}
                "^w_(\\d+)$": {"param": 135, "shortName": "w"}
                "^z_(\\d+)$": {"param": 129, "shortName": "z"}

# silenced due to bug in anemoi-inference for multi-step temporal downscalers, can be removed when fixed
verbosity: 0
allow_nans: true
output_frequency: "1h"
