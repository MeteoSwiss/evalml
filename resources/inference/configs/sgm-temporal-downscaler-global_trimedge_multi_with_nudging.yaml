runner: temporal_downscaler

input:
  cutout:
    - lam_0:
        grib:
          path: forecaster/20*
          pre_processors:
            - forward_transform_filter:
                # does not have an effect if the temporal downscaler does not use tp as prognostic variable
                rescale:
                  scale: 0.001 # convert from kg m-2 to m
                  offset: 0
                  param: tp
            # nudge the initial condition toward station observations.
            - forward_transform_filter:
                retrieve_observation:
                  obs_path: observation/nudging_station_obs_raw.parquet
                  jretrieve_src_path: /scratch/mch/llanzila/sruc/evalml/src/data_input/
                  retrieval_bbox: [40.5, 53.0, 0.0, 17.5]
                  # station_group: "1,2"
                  variables: [T_2M, TD_2M, U_10M, V_10M, TOT_PREC, PMSL, PS]
                  use_limitation: 40
                  run_mode: "devt"
                  station_filter_mode: domain
                  trim_bbox: [45.7, 48.0, 5.8, 10.8]
            - forward_transform_filter:
                clean_observation:
                  obs_path_in: observation/nudging_station_obs_raw.parquet
                  obs_path_out: observation/nudging_station_obs.parquet
            - forward_transform_filter:
                nudge_toward_observation:
                  obs_path: observation/nudging_station_obs.parquet
                  nudge_variables: [T_2M, TD_2M, U_10M, V_10M, PMSL, PS]
                  temperature_lapse_rate: 0.0065  # K/m
                  pressure_lapse_rate: 11.5  # Pa/m
                  icon_grid_dir: /scratch/mch/llanzila/sruc/aux_files
                  topo_file: /scratch/mch/llanzila/sruc/aux_files/topo_descriptors_icon_R19B08.nc
                  dem_barrier_file: /store_new/mch/msclim/appclim/data/grids/topodem/v2/topo/radar_100/topo_DEM_1000M.nc
                  d_eff_file: /scratch/mch/llanzila/sruc/aux_files/d_eff_cache_domain_maxdist50km_nbar50x3_bw1500m_elev50_elevdiff100_nsta1939.nc
                  weight_power: 2.0
                  max_dist: 50000.0   # meters (50 km), station influence radius
                  variable_overrides:
                    U_10M:
                      d_eff_file: /scratch/mch/llanzila/sruc/aux_files/d_eff_cache_domain_maxdist50km_nbar50x3_bw1500m_elev50_elevdiff100_nsta1939.nc
                      max_dist: 50000.0
                    V_10M:
                      d_eff_file: /scratch/mch/llanzila/sruc/aux_files/d_eff_cache_domain_maxdist50km_nbar50x3_bw1500m_elev50_elevdiff100_nsta1939.nc
                      max_dist: 50000.0
                  use_topo_descriptors: false
                  min_topo_w: 0.2
                  lim_effective: 0.0
                  use_reliability_check: true
                  number_of_std: 5.0
                  reliability_min_dist_frac: 0.0
                  enable_plotting: true
                  plot_dir: output/nudging_reliability_diagnostics
                  run_mode: "devt"
          namer: &namer
            rules:
              - - shortName: T
                - t_{level}
              - - shortName: U
                - u_{level}
              - - shortName: V
                - v_{level}
              - - shortName: W
                - w_{level}
              - - shortName: QV
                - q_{level}
              - - shortName: FI
                - z_{level}
              - - shortName: PMSL
                - msl
              - - shortName: FIS
                - z
              - - shortName: PS
                - sp
              - - shortName: T_2M
                - 2t
              - - shortName: TD_2M
                - 2d
              - - shortName: T_G
                - skt
              - - shortName: U_10M
                - 10u
              - - shortName: V_10M
                - 10v
              - - shortName: FR_LAND
                - lsm
              - - shortName: TOT_PREC
                - tp
    - global:
        grib:
          path: forecaster/ifs*
          namer: *namer

constant_forcings:
  test:
    use_original_paths: true

patch_metadata: resources/sgm-temporal-downscaler-ich1-oper-patch.yaml

post_processors:
  - accumulate_from_start_of_forecast: # accumulate tp from start of forecast
      accumulations:
        - tp
  - forward_transform_filter:
      rescale:
        scale: 1000 # convert units from m to kg m-2
        offset: 0
        param: tp

output:
  tee:
    - grib:
        path: grib/{dateTime}_{step:03}.grib
        encoding:
          typeOfGeneratingProcess: 2
        templates:
            samples: resources/templates_index_icon.yaml
        post_processors:
          - extract_mask: # removes global points
              mask: "lam_0/cutout_mask"
              as_slice: true
          # here, the trimedge mask can be specified when available

    - grib:
        path: grib/ifs-{dateTime}_{step:03}.grib
        encoding:
          typeOfGeneratingProcess: 2
        templates:
          samples: resources/templates_index_ifs.yaml
        post_processors:
          - extract_mask: # removes lam points
              mask: "lam_0/cutout_mask"
              as_slice: true
              inverse: true
          - assign_mask: # fill local/global overlapping points with nan
              mask: "global/cutout_mask"
        modifiers:
          - patches:
            - variable:
                U_10M: {"param": 165, "shortName": "10u"}
                10u: {"param": 165, "shortName": "10u"}
                V_10M: {"param": 166, "shortName": "10v"}
                10v: {"param": 166, "shortName": "10v"}
                TD_2M: {"param": 168, "shortName": "2d"}
                2d: {"param": 168, "shortName": "2d"}
                T_2M: {"param": 167, "shortName": "2t"}
                2t: {"param": 167, "shortName": "2t"}
                FR_LAND: {"param": 172, "shortName": "lsm"}
                lsm: {"param": 172, "shortName": "lsm"}
                PMSL: {"param": 151, "shortName": "msl"}
                msl: {"param": 151, "shortName": "msl"}
                PS: {"param": 134, "shortName": "sp"}
                sp: {"param": 134, "shortName": "sp"}
                SSO_SIGMA: {"param": 163, "shortName": "slor"}
                slor: {"param": 163, "shortName": "slor"}
                SSO_STDH: {"param": 160, "shortName": "sdor"}
                sdor: {"param": 160, "shortName": "sdor"}
                TOT_PREC: {"param": 228, "shortName": "tp"}
                tp: {"param": 228, "shortName": "tp"}
                z: {"param": 129, "shortName": "z"}
                "^q_(\\d+)$": {"param": 133, "shortName": "q"}
                "^t_(\\d+)$": {"param": 130, "shortName": "t"}
                "^u_(\\d+)$": {"param": 131, "shortName": "u"}
                "^v_(\\d+)$": {"param": 132, "shortName": "v"}
                "^w_(\\d+)$": {"param": 135, "shortName": "w"}
                "^z_(\\d+)$": {"param": 129, "shortName": "z"}

# silenced due to bug in anemoi-inference for multi-step temporal downscalers, can be removed when fixed
verbosity: 0
allow_nans: true
output_frequency: "1h"
