input:
  test:
    use_original_paths: true

allow_nans: true

patch_metadata:
  config:
    dataloader:
      test:
        dataset: /store_new/mch/msopr/ml/datasets/aifs-od-an-oper-0001-mars-n320-2016-2026-6h-v1-combined-land.zarr

post_processors:
  - accumulate_from_start_of_forecast:
      accumulations:
        - tp
 # We use `backward_transform_filter` instead of `forward_transform_filter` 
 # as this is not supported in the pinned anemoi-inference version used for aifs-single's evalml config (anemoi-inference=0.11.1)
  - backward_transform_filter:
      filter: rescale
      scale: 0.001 # convert units from m to kg m-2 (backward: x/scale = x*1000)
      offset: 0
      param: tp

output:
  grib:
    path: grib/{date}{time:04}_{step:03}.grib

write_initial_state: true
