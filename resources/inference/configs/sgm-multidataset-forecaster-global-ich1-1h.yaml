lead_time: 120h
write_initial_state: true
allow_nans: true

env:
  ANEMOI_INFERENCE_NUM_CHUNKS: 8 # OOM error if not set

# inputs
input:
  test:
    use_original_paths: true

post_processors:
  - accumulate_from_start_of_forecast: # accumulate tp from start of forecast
      accumulations:
        - tp
  - forward_transform_filter:
      rescale:
        scale: 1000 # convert units from m to kg m-2
        offset: 0
        param: tp

output:
  tee:
    - grib:
        path: grib/{date}{time:04}_{step:03}.grib
        encoding:
          typeOfGeneratingProcess: 2
          centre: lssw
        templates:
          samples: resources/templates_index_icon.yaml
        post_processors:
          - extract_mask: # removes global points
              mask: "lam_0/cutout_mask"
              as_slice: true
        modifiers:
          - patches:
            # The checkpoint variables keep their native IFS param names (the
            # patch metadata renames nothing — see its header), so the MCH
            # shortNames for this output are set here per variable. Patterns
            # are matched top to bottom against the variable name; the first
            # match wins.
            # ssrd/strd have no shortName under centre=lssw, so those two
            # messages are encoded with centre=ecmf (shortNames ssrd/strd,
            # paramIds 169/175), consistent with the IFS output below.
            - variable:
                "^2t$": {"shortName": "T_2M"}
                "^2d$": {"shortName": "TD_2M"}
                "^10u$": {"shortName": "U_10M"}
                "^10v$": {"shortName": "V_10M"}
                "^sp$": {"shortName": "PS"}
                "^msl$": {"shortName": "PMSL"}
                "^lsm$": {"shortName": "FR_LAND"}
                "^z$": {"shortName": "FIS"}
                "^skt$": {"shortName": "T_G"}
                "^sdor$": {"shortName": "SSO_STDH"}
                "^slor$": {"shortName": "SSO_SIGMA"}
                "^tp$": {"shortName": "TOT_PREC"}
                "^tcc$": {"shortName": "CLCT"}
                "^lcc$": {"shortName": "CLCL"}
                "^mcc$": {"shortName": "CLCM"}
                "^hcc$": {"shortName": "CLCH"}
                "^ssrd$": {"centre": "ecmf"}
                "^strd$": {"centre": "ecmf"}
                "^q_(\\d+)$": {"shortName": "QV"}
                "^t_(\\d+)$": {"shortName": "T"}
                "^u_(\\d+)$": {"shortName": "U"}
                "^v_(\\d+)$": {"shortName": "V"}
                "^w_(\\d+)$": {"shortName": "OMEGA"}
                "^z_(\\d+)$": {"shortName": "FI"}
    - grib:
        path: grib/ifs-{date}{time:04}_{step:03}.grib
        encoding:
          typeOfGeneratingProcess: 2
          centre: ecmf
        templates:
          samples: resources/templates_index_ifs.yaml
        post_processors:
        - extract_mask: # removes lam points
            mask: "lam_0/cutout_mask"
            as_slice: true
            inverse: true
        - assign_mask: # fill local/global overlapping points with nan
            mask: "global/cutout_mask"
        modifiers:
          - patches:
            # The checkpoint variables already carry their native IFS param
            # names (the patch metadata renames nothing), so only the paramId
            # needs pinning here. "z" is anchored: patterns are prefix-matched
            # in order, and a bare "z" would shadow the z_<level> entry below.
            - variable:
                "^10u$": {"param": 165, "shortName": "10u"}
                "^10v$": {"param": 166, "shortName": "10v"}
                "^2d$": {"param": 168, "shortName": "2d"}
                "^2t$": {"param": 167, "shortName": "2t"}
                "^lsm$": {"param": 172, "shortName": "lsm"}
                "^msl$": {"param": 151, "shortName": "msl"}
                "^sp$": {"param": 134, "shortName": "sp"}
                "^slor$": {"param": 163, "shortName": "slor"}
                "^sdor$": {"param": 160, "shortName": "sdor"}
                "^tp$": {"param": 228, "shortName": "tp"}
                "^tcc$": {"param": 164, "shortName": "tcc"}
                "^lcc$": {"param": 186, "shortName": "lcc"}
                "^mcc$": {"param": 187, "shortName": "mcc"}
                "^hcc$": {"param": 188, "shortName": "hcc"}
                "^skt$": {"param": 235, "shortName": "skt"}
                "^ssrd$": {"param": 169, "shortName": "ssrd"}
                "^strd$": {"param": 175, "shortName": "strd"}
                "^z$": {"param": 129, "shortName": "z"}
                "^q_(\\d+)$": {"param": 133, "shortName": "q"}
                "^t_(\\d+)$": {"param": 130, "shortName": "t"}
                "^u_(\\d+)$": {"param": 131, "shortName": "u"}
                "^v_(\\d+)$": {"param": 132, "shortName": "v"}
                "^w_(\\d+)$": {"param": 135, "shortName": "w"}
                "^z_(\\d+)$": {"param": 129, "shortName": "z"}

patch_metadata: resources/sgm-multidataset-ich1-patch-1h.yaml